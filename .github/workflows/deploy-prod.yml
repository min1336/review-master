name: Deploy to Production Server

on:
  workflow_dispatch:
    inputs:
      force_infra_deploy:
        description: "Force infra deploy (use when GitHub Secrets changed)"
        required: false
        default: "false"
        type: choice
        options: [ "false", "true" ]
      reason:
        description: "Reason for manual deploy"
        required: false
        type: string
  push:
    branches:
      - main

concurrency:
  group: "deploy-prod-${{ github.ref }}"
  cancel-in-progress: false

env:
  image_name: "review-api"
  default_directory: "review-tm2"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Github Actions IP
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Add Github Actions IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_TM2_BASTION_SG }} \
            --protocol tcp \
            --port ${{ secrets.AWS_TM2_BASTION_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 2>&1 | grep -v "already exists" || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk usage (pre-build)
        run: |
          df -h
          docker system df || true

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.image_name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.image_name }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.image_name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.image_name }}:buildcache,mode=min

      - name: Debug SSH Configuration
        if: failure()
        run: |
          echo "🔍 SSH 디버깅 정보 (배포 실패 시에만 출력):"
          echo "================================"
          echo "Bastion Host: [CONFIGURED]"
          echo "Bastion Username: [CONFIGURED]"
          echo "Production Host: [CONFIGURED]"
          echo "Production Username: [CONFIGURED]"
          echo "================================"
          echo "Bastion Key lines: $(echo "$BASTION_KEY" | wc -l)"
          echo "Production Key lines: $(echo "$PROD_KEY" | wc -l)"
        env:
          BASTION_KEY: ${{ secrets.AWS_TM2_BASTION_KEY }}
          PROD_KEY: ${{ secrets.PROD_SERVER_KEY }}
      - name: Test Bastion Host Connection
        run: |
          echo "🔌 Bastion Host 연결 테스트..."
          
          # SSH 키를 임시 파일로 저장
          printf '%s\n' "${{ secrets.AWS_TM2_BASTION_KEY }}" > /tmp/bastion_key
          chmod 600 /tmp/bastion_key
          
          # SSH 연결 테스트 (verbose 모드)
          ssh -v -i /tmp/bastion_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            ${{ secrets.AWS_TM2_BASTION_USERNAME }}@${{ secrets.AWS_TM2_BASTION_HOST }} \
            "echo 'Bastion Host 연결 성공!'" || echo "❌ Bastion Host 연결 실패"
          
          # 임시 파일 삭제
          rm -f /tmp/bastion_key

      - name: Test Production Server Connection via Bastion
        run: |
          echo "🔌 Production Server 연결 테스트 (Bastion 경유)..."
          
          # SSH 키를 임시 파일로 저장
          printf '%s\n' "${{ secrets.AWS_TM2_BASTION_KEY }}" > /tmp/bastion_key
          printf '%s\n' "${{ secrets.PROD_SERVER_KEY }}" > /tmp/prod_key
          chmod 600 /tmp/bastion_key /tmp/prod_key
          
          # ProxyJump를 사용한 연결 테스트
          ssh -v -i /tmp/prod_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i /tmp/bastion_key -W %h:%p -o StrictHostKeyChecking=no ${{ secrets.AWS_TM2_BASTION_USERNAME }}@${{ secrets.AWS_TM2_BASTION_HOST }}" \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "echo 'Production Server 연결 성공!'" || echo "❌ Production Server 연결 실패"
          
          # 임시 파일 삭제
          rm -f /tmp/bastion_key /tmp/prod_key

      - name: Prepare atomic deployment file
        run: cp docker-compose.prod.yml docker-compose.prod.yml.new

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          proxy_host: ${{ secrets.AWS_TM2_BASTION_HOST }}
          proxy_username: ${{ secrets.AWS_TM2_BASTION_USERNAME }}
          proxy_key: ${{ secrets.AWS_TM2_BASTION_KEY }}
          proxy_port: ${{ secrets.AWS_TM2_BASTION_PORT }}
          source: "docker-compose.prod.yml.new"
          target: "/home/${{ secrets.PROD_SERVER_USER }}/${{ env.default_directory }}/"
          debug: true

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_PREFIX: ${{ secrets.API_PREFIX }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ATHENA_DATABASE: ${{ secrets.ATHENA_DATABASE }}
          ATHENA_OUTPUT_BUCKET: ${{ secrets.ATHENA_OUTPUT_BUCKET }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          CARMORE_ADMIN_URL: ${{ secrets.CARMORE_ADMIN_URL }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          proxy_host: ${{ secrets.AWS_TM2_BASTION_HOST }}
          proxy_username: ${{ secrets.AWS_TM2_BASTION_USERNAME }}
          proxy_key: ${{ secrets.AWS_TM2_BASTION_KEY }}
          proxy_port: ${{ secrets.AWS_TM2_BASTION_PORT }}
          debug: true
          script_stop: true
          envs: API_PREFIX,OPENAI_API_KEY,LLM_PROVIDER,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ATHENA_DATABASE,ATHENA_OUTPUT_BUCKET,DATABASE_USER,DATABASE_PASSWORD,DATABASE_HOST,DATABASE_PORT,DATABASE_NAME,N8N_API_KEY,GHCR_PAT,GITHUB_ACTOR,CARMORE_ADMIN_URL
          script: |
            echo "🚀 배포 시작..."
            
            mkdir -p /home/${{ secrets.PROD_SERVER_USER }}/${{ env.default_directory }}
            # 작업 디렉토리로 이동 (필수)
            cd /home/${{ secrets.PROD_SERVER_USER }}/${{ env.default_directory }}
            echo "현재 디렉토리: $(pwd)"
            echo "사용자: $(whoami)"
            
            # Atomic File Swap (원자적 교체)
            mv -f docker-compose.prod.yml.new docker-compose.prod.yml
            
            # .env 생성 (GitHub Secrets 주입)
            umask 077
            : > .env
            printf 'API_PREFIX=%s\n' "$API_PREFIX" >> .env
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> .env
            printf 'LLM_PROVIDER=%s\n' "$LLM_PROVIDER" >> .env
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID" >> .env
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY" >> .env
            printf 'AWS_REGION=%s\n' "$AWS_REGION" >> .env
            printf 'ATHENA_DATABASE=%s\n' "$ATHENA_DATABASE" >> .env
            printf 'ATHENA_OUTPUT_BUCKET=%s\n' "$ATHENA_OUTPUT_BUCKET" >> .env
            printf 'DATABASE_USER=%s\n' "$DATABASE_USER" >> .env
            printf 'DATABASE_PASSWORD=%s\n' "$DATABASE_PASSWORD" >> .env
            printf 'DATABASE_HOST=%s\n' "$DATABASE_HOST" >> .env
            printf 'DATABASE_PORT=%s\n' "$DATABASE_PORT" >> .env
            printf 'DATABASE_NAME=%s\n' "$DATABASE_NAME" >> .env
            printf 'N8N_API_KEY=%s\n' "$N8N_API_KEY" >> .env
            printf 'N8N_TEST_MODE=false\n' >> .env
            printf 'CARMORE_ADMIN_URL=%s\n' "$CARMORE_ADMIN_URL" >> .env
            echo "✅ .env created"
            
            # GitHub Container Registry 로그인
            if ! printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
              echo "❌ GHCR login failed! Check GHCR_PAT secret."
              exit 1
            fi
            
            if ! docker pull ghcr.io/${{ github.repository_owner }}/${{ env.image_name }}:latest; then
              echo "❌ Failed to pull API Docker image!"
              exit 1
            fi
            
            docker compose --env-file .env -f docker-compose.prod.yml up -d

      - name: Remove Github Actions IP From Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_TM2_BASTION_SG }} \
            --protocol tcp \
            --port ${{ secrets.AWS_TM2_BASTION_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 2>&1 | grep -v "does not exist" || true

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Production deployment successful!"
          else
            echo "❌ Production deployment failed!"
          fi
