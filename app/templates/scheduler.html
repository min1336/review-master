<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n 스케줄러 관리</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="{{ base_path }}/static/css/shared-theme.css">

    <style>
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Workflow Card */
        .wf-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--grey-7);
        }

        .wf-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .wf-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--grey-1);
        }


        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.active { background: var(--success-light); color: #065f46; }
        .status-badge.inactive { background: var(--error-light); color: #991b1b; }
        .status-badge.unknown { background: var(--grey-8); color: var(--grey-5); }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge.active .status-dot { background: var(--success); }
        .status-badge.inactive .status-dot { background: var(--error); }
        .status-badge.unknown .status-dot { background: var(--grey-5); }


        /* Cron Editor - Visual Time Picker */
        .cron-editor { margin-bottom: 16px; }

        .cron-editor-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--grey-2);
            margin-bottom: 10px;
        }

        /* Frequency tabs */
        .freq-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 14px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--grey-7);
        }

        .freq-tab {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border: none;
            background: white;
            color: var(--grey-3);
            cursor: pointer;
            transition: all 0.2s;
            border-right: 1px solid var(--grey-7);
        }

        .freq-tab:last-child { border-right: none; }
        .freq-tab.selected { background: var(--primary); color: white; }
        .freq-tab:hover:not(.selected) { background: var(--grey-9); }

        /* Day-of-week buttons */
        .dow-row {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }

        .dow-btn {
            width: 40px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--grey-7);
            background: white;
            font-size: 13px;
            font-weight: 500;
            color: var(--grey-3);
            cursor: pointer;
            transition: all 0.15s;
        }

        .dow-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .dow-btn:hover:not(.selected) { background: var(--grey-9); border-color: var(--grey-5); }

        /* Day-of-month selector */
        .dom-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .dom-label {
            font-size: 13px;
            color: var(--grey-3);
            white-space: nowrap;
        }

        .dom-select {
            padding: 6px 10px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: white;
            cursor: pointer;
            outline: none;
            min-width: 70px;
        }

        .dom-select:focus { border-color: var(--primary); }

        /* Time picker row */
        .time-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .time-label {
            font-size: 13px;
            color: var(--grey-3);
            white-space: nowrap;
        }

        .time-select {
            padding: 8px 10px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            background: white;
            cursor: pointer;
            outline: none;
            min-width: 70px;
            text-align: center;
        }

        .time-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13, 111, 252, 0.1); }

        .time-colon {
            font-size: 18px;
            font-weight: 700;
            color: var(--grey-3);
        }

        /* Quick presets */
        .quick-presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .preset-chip {
            padding: 5px 12px;
            border-radius: 16px;
            border: 1px solid var(--grey-7);
            background: white;
            font-size: 12px;
            color: var(--grey-3);
            cursor: pointer;
            transition: all 0.15s;
        }

        .preset-chip:hover { border-color: var(--primary); color: var(--primary); background: rgba(13, 111, 252, 0.05); }
        .preset-chip.active { border-color: var(--primary); color: var(--primary); background: rgba(13, 111, 252, 0.08); font-weight: 600; }


        .cron-validation { font-size: 12px; margin-top: 6px; min-height: 18px; }
        .cron-validation.valid { color: var(--success); }
        .cron-validation.invalid { color: var(--error); }

        /* ── Schedule Groups ──────────────────── */
        .groups-section {
            margin-bottom: 16px;
        }

        .groups-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .groups-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--grey-2);
        }

        .btn-add-group {
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            border: 1px dashed var(--primary);
            background: rgba(13, 111, 252, 0.04);
            color: var(--primary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-group:hover { background: rgba(13, 111, 252, 0.1); }

        .group-card {
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            overflow: hidden;
        }

        .group-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--grey-9);
            cursor: pointer;
            user-select: none;
        }

        .group-card-header:hover { background: var(--grey-8); }

        .group-name {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: var(--grey-2);
        }

        .group-meta {
            font-size: 11px;
            color: var(--grey-5);
        }

        .group-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: white;
            border: 1px solid var(--grey-7);
            color: var(--grey-5);
        }

        .group-badge.has-targets { color: var(--primary); border-color: var(--primary); }

        .group-body { display: none; padding: 14px; border-top: 1px solid var(--grey-7); }
        .group-body.open { display: block; }

        .group-name-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
        }

        .group-name-input:focus { border-color: var(--primary); }

        .group-cron-section {
            margin-bottom: 12px;
            padding: 10px;
            background: var(--grey-9);
            border-radius: var(--radius-sm);
        }

        .group-cron-section .freq-tabs { margin-bottom: 10px; }
        .group-cron-section .time-row { margin-bottom: 10px; }

        .group-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-save-group {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-save-group:hover { background: var(--primary-hover); }
        .btn-save-group:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-delete-group {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--error);
            background: white;
            color: var(--error);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete-group:hover { background: var(--error); color: white; }

        /* Branch list (reused in groups) */
        .targets-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .targets-search {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 13px;
            outline: none;
        }

        .targets-search:focus { border-color: var(--primary); }

        .targets-sort {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .sort-btn {
            padding: 4px 10px;
            border-radius: 14px;
            border: 1px solid var(--grey-7);
            background: white;
            font-size: 11px;
            color: var(--grey-4);
            cursor: pointer;
            transition: all 0.15s;
        }

        .sort-btn:hover { border-color: var(--grey-5); }
        .sort-btn.active { background: var(--grey-2); color: white; border-color: var(--grey-2); }

        .targets-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }

        .target-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            font-size: 12px;
            border-bottom: 1px solid var(--grey-8);
            cursor: pointer;
        }

        .target-item:last-child { border-bottom: none; }
        .target-item:hover { background: var(--grey-9); }
        .target-item input[type="checkbox"] { accent-color: var(--primary); cursor: pointer; }
        .target-name { flex: 1; color: var(--grey-2); }
        .target-meta { font-size: 11px; color: var(--grey-5); white-space: nowrap; }

        .groups-empty {
            text-align: center;
            padding: 20px;
            color: var(--grey-5);
            font-size: 13px;
            border: 1px dashed var(--grey-7);
            border-radius: var(--radius-sm);
        }

        /* Actions */
        .wf-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid var(--grey-7);
        }

        .btn-schedule {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-schedule:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-toggle-active { background: var(--success); color: white; }
        .btn-toggle-active:hover:not(:disabled) { background: #059669; }
        .btn-toggle-inactive { background: var(--error); color: white; }
        .btn-toggle-inactive:hover:not(:disabled) { background: #dc2626; }

        /* Loading */
        .loading-container { text-align: center; padding: 60px 0; color: var(--grey-5); }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--grey-7);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-banner {
            background: var(--error-light);
            color: #991b1b;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>n8n 스케줄러 관리</h1>
        <div class="header-actions">
            <button class="btn btn-header-nav" id="btn-back">대시보드</button>
        </div>
    </header>

    <div class="container">
        <div id="content">
            <div class="loading-container">
                <div class="spinner"></div>
                <p style="margin-top: 12px;">워크플로 정보를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <!-- Shared Utils (escapeHtml, escapeAttr, debounce, showToast, apiRequest) -->
    <script src="{{ base_path }}/static/js/shared-utils.js"></script>

    <script>
        const API_PREFIX = '{{ api_prefix }}';
        const BASE_PATH = API_PREFIX.replace('/api', '');
        const SUMMARY_WF_ID = 'xQTiHwJTH8JTFcn3';
        const WF_NAME_KO = {
            [SUMMARY_WF_ID]: '요약 리포트 생성',
        };
        const DEFAULT_WF_NAME = '리뷰 동기화';

        const QUICK_PRESETS = [
            { label: '매일 6시', cron: '0 6 * * *' },
            { label: '매일 7시', cron: '0 7 * * *' },
            { label: '매일 9시', cron: '0 9 * * *' },
            { label: '매주 월 9시', cron: '0 9 * * 1' },
            { label: '매월 1일 7시', cron: '0 7 1 * *' },
        ];

        const DOW_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
        const FREQ_DAILY = 'daily', FREQ_WEEKLY = 'weekly', FREQ_MONTHLY = 'monthly';

        // ── 페이지 초기화 ────────────────────────────────

        document.getElementById('btn-back').addEventListener('click', function () {
            window.location.href = BASE_PATH + '/';
        });

        loadWorkflows();

        // ── DOM 빌더 헬퍼 ────────────────────────────────

        function el(tag, attrs, children) {
            var node = document.createElement(tag);
            if (attrs) {
                Object.keys(attrs).forEach(function (k) {
                    if (k === 'className') node.className = attrs[k];
                    else if (k === 'textContent') node.textContent = attrs[k];
                    else if (k === 'style' && typeof attrs[k] === 'object') {
                        Object.assign(node.style, attrs[k]);
                    } else node.setAttribute(k, attrs[k]);
                });
            }
            if (children) {
                children.forEach(function (child) {
                    if (typeof child === 'string') node.appendChild(document.createTextNode(child));
                    else if (child) node.appendChild(child);
                });
            }
            return node;
        }

        // ── 워크플로 목록 로드 ──────────────────────────────

        async function loadWorkflows() {
            try {
                var result = await apiRequest(API_PREFIX + '/n8n/scheduler/workflows');
                renderWorkflows(result.data);
            } catch (e) {
                var container = document.getElementById('content');
                container.textContent = '';
                container.appendChild(el('div', { className: 'error-banner' },
                    ['워크플로 정보를 불러올 수 없습니다: ' + (e.message || '알 수 없는 오류')]));
            }
        }

        // ── 렌더링 ──────────────────────────────

        function renderWorkflows(workflows) {
            var container = document.getElementById('content');
            container.textContent = '';

            if (!workflows || workflows.length === 0) {
                container.appendChild(el('div', { className: 'error-banner' }, ['관리 대상 워크플로가 없습니다.']));
                return;
            }

            workflows.forEach(function (wf) {
                container.appendChild(buildCard(wf));
                bindCardEvents(wf);
            });
        }

        function buildCard(wf) {
            var statusClass = wf.active === true ? 'active' : wf.active === false ? 'inactive' : 'unknown';
            var statusText = wf.active === true ? '활성' : wf.active === false ? '비활성' : '알 수 없음';

            var badge = el('span', { className: 'status-badge ' + statusClass }, [
                el('span', { className: 'status-dot' }), statusText
            ]);

            var koName = WF_NAME_KO[wf.id] || DEFAULT_WF_NAME;
            var header = el('div', { className: 'wf-card-header' }, [
                el('span', { className: 'wf-name', textContent: koName }), badge
            ]);

            // Actions (공통)
            var toggleBtnClass = wf.active ? 'btn-toggle-inactive' : 'btn-toggle-active';
            var toggleBtnText = wf.active ? '비활성화' : '활성화';
            var btnToggle = el('button', { className: 'btn-schedule ' + toggleBtnClass, id: 'btn-toggle-' + wf.id, textContent: toggleBtnText });
            btnToggle.dataset.active = String(wf.active);

            var cardChildren = [header];

            if (wf.id === SUMMARY_WF_ID) {
                // Summary Job: 그룹별 스케줄 관리 → 워크플로 레벨 스케줄 에디터 불필요
                var groupsContainer = el('div', { className: 'groups-section', id: 'groups-' + wf.id });
                cardChildren.push(groupsContainer);
                var actions = el('div', { className: 'wf-actions' }, [
                    btnToggle
                ]);
            } else {
                // Review Sync Job: 크론 에디터 표시
                var editor = buildCronEditor(wf);
                var btnSave = el('button', { className: 'btn-schedule btn-save', id: 'btn-save-' + wf.id, textContent: '스케줄 저장' });
                cardChildren.push(editor);
                var actions = el('div', { className: 'wf-actions' }, [
                    btnSave, btnToggle
                ]);
            }

            cardChildren.push(actions);
            return el('div', { className: 'wf-card', id: 'card-' + wf.id }, cardChildren);
        }

        // ── 시각적 크론 에디터 빌더 ────────────────────────

        function parseCronToUI(expr) {
            var parts = (expr || '').trim().split(/\s+/);
            if (parts.length !== 5) return { freq: FREQ_DAILY, minute: 0, hour: 6, dow: 1, dom: 1 };
            var minute = parseInt(parts[0]) || 0;
            var hour = parseInt(parts[1]) || 0;
            var dom = parts[2], dow = parts[4];
            if (dow !== '*') return { freq: FREQ_WEEKLY, minute: minute, hour: hour, dow: parseInt(dow) || 1, dom: 1 };
            if (dom !== '*') return { freq: FREQ_MONTHLY, minute: minute, hour: hour, dow: 1, dom: parseInt(dom) || 1 };
            return { freq: FREQ_DAILY, minute: minute, hour: hour, dow: 1, dom: 1 };
        }

        function uiToCron(state) {
            var m = String(state.minute), h = String(state.hour);
            if (state.freq === FREQ_WEEKLY) return m + ' ' + h + ' * * ' + state.dow;
            if (state.freq === FREQ_MONTHLY) return m + ' ' + h + ' ' + state.dom + ' * *';
            return m + ' ' + h + ' * * *';
        }

        var editorStates = {};

        function buildCronEditor(wf) {
            var state = parseCronToUI(wf.cron_expression);
            editorStates[wf.id] = state;

            var wrap = el('div', { className: 'cron-editor', id: 'editor-' + wf.id });
            wrap.appendChild(el('div', { className: 'cron-editor-title', textContent: '스케줄 변경' }));

            // Quick Presets
            var presets = el('div', { className: 'quick-presets', id: 'presets-' + wf.id });
            QUICK_PRESETS.forEach(function (p) {
                var chip = el('button', { className: 'preset-chip', textContent: p.label });
                chip.dataset.cron = p.cron;
                if (p.cron === wf.cron_expression) chip.classList.add('active');
                presets.appendChild(chip);
            });
            wrap.appendChild(presets);

            // Frequency Tabs
            var tabs = el('div', { className: 'freq-tabs', id: 'freq-tabs-' + wf.id });
            [{ key: FREQ_DAILY, label: '매일' }, { key: FREQ_WEEKLY, label: '매주' }, { key: FREQ_MONTHLY, label: '매월' }]
                .forEach(function (f) {
                    var tab = el('button', { className: 'freq-tab' + (state.freq === f.key ? ' selected' : ''), textContent: f.label });
                    tab.dataset.freq = f.key;
                    tabs.appendChild(tab);
                });
            wrap.appendChild(tabs);

            // Day-of-week
            var dowRow = el('div', { className: 'dow-row', id: 'dow-row-' + wf.id });
            if (state.freq !== FREQ_WEEKLY) dowRow.style.display = 'none';
            DOW_LABELS.forEach(function (label, i) {
                var btn = el('button', { className: 'dow-btn' + (state.dow === i ? ' selected' : ''), textContent: label });
                btn.dataset.dow = String(i);
                dowRow.appendChild(btn);
            });
            wrap.appendChild(dowRow);

            // Day-of-month
            var domSelect = el('select', { className: 'dom-select', id: 'dom-select-' + wf.id });
            for (var d = 1; d <= 31; d++) {
                var opt = el('option', { value: String(d), textContent: d + '일' });
                if (d === state.dom) opt.selected = true;
                domSelect.appendChild(opt);
            }
            var domRow = el('div', { className: 'dom-row', id: 'dom-row-' + wf.id }, [
                el('span', { className: 'dom-label', textContent: '매월' }), domSelect,
                el('span', { className: 'dom-label', textContent: '에 실행' })
            ]);
            if (state.freq !== FREQ_MONTHLY) domRow.style.display = 'none';
            wrap.appendChild(domRow);

            // Time picker
            var hourSel = el('select', { className: 'time-select', id: 'hour-sel-' + wf.id });
            for (var h = 0; h < 24; h++) {
                var hOpt = el('option', { value: String(h), textContent: String(h).padStart(2, '0') });
                if (h === state.hour) hOpt.selected = true;
                hourSel.appendChild(hOpt);
            }
            var minSel = el('select', { className: 'time-select', id: 'min-sel-' + wf.id });
            var minOptions = [0, 5, 10, 15, 20, 30, 45];
            if (minOptions.indexOf(state.minute) === -1) minOptions.push(state.minute);
            minOptions.sort(function (a, b) { return a - b; });
            minOptions.forEach(function (m) {
                var mOpt = el('option', { value: String(m), textContent: String(m).padStart(2, '0') });
                if (m === state.minute) mOpt.selected = true;
                minSel.appendChild(mOpt);
            });
            wrap.appendChild(el('div', { className: 'time-row' }, [
                el('span', { className: 'time-label', textContent: '실행 시각' }),
                hourSel, el('span', { className: 'time-colon', textContent: ':' }), minSel
            ]));

            wrap.appendChild(el('div', { className: 'cron-validation', id: 'cron-validation-' + wf.id }));

            return wrap;
        }

        function refreshCronDisplay(wfId) {
            var state = editorStates[wfId];
            var expr = uiToCron(state);
            var display = document.getElementById('cron-display-' + wfId);
            if (display) display.textContent = expr;
            var presets = document.querySelectorAll('#presets-' + wfId + ' .preset-chip');
            presets.forEach(function (chip) { chip.classList.toggle('active', chip.dataset.cron === expr); });
            validateCron(wfId, expr);
        }

        // ── 이벤트 바인딩 ────────────────────────────────

        function bindCardEvents(wf) {
            var btnToggle = document.getElementById('btn-toggle-' + wf.id);
            btnToggle.addEventListener('click', function () { toggleWorkflow(wf.id); });

            if (wf.id === SUMMARY_WF_ID) {
                // Summary Job: 그룹만 로드
                loadGroups(wf.id);
                return;
            }

            // Review Sync Job: 크론 에디터 이벤트 바인딩
            var btnSave = document.getElementById('btn-save-' + wf.id);
            btnSave.addEventListener('click', function () { updateSchedule(wf.id); });

            document.querySelectorAll('#presets-' + wf.id + ' .preset-chip').forEach(function (chip) {
                chip.addEventListener('click', function () {
                    editorStates[wf.id] = parseCronToUI(chip.dataset.cron);
                    syncUIFromState(wf.id);
                    refreshCronDisplay(wf.id);
                });
            });

            document.querySelectorAll('#freq-tabs-' + wf.id + ' .freq-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('#freq-tabs-' + wf.id + ' .freq-tab').forEach(function (t) { t.classList.remove('selected'); });
                    tab.classList.add('selected');
                    editorStates[wf.id].freq = tab.dataset.freq;
                    document.getElementById('dow-row-' + wf.id).style.display = tab.dataset.freq === FREQ_WEEKLY ? 'flex' : 'none';
                    document.getElementById('dom-row-' + wf.id).style.display = tab.dataset.freq === FREQ_MONTHLY ? 'flex' : 'none';
                    refreshCronDisplay(wf.id);
                });
            });

            document.querySelectorAll('#dow-row-' + wf.id + ' .dow-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('#dow-row-' + wf.id + ' .dow-btn').forEach(function (b) { b.classList.remove('selected'); });
                    btn.classList.add('selected');
                    editorStates[wf.id].dow = parseInt(btn.dataset.dow);
                    refreshCronDisplay(wf.id);
                });
            });

            var domSelect = document.getElementById('dom-select-' + wf.id);
            if (domSelect) domSelect.addEventListener('change', function () {
                editorStates[wf.id].dom = parseInt(domSelect.value);
                refreshCronDisplay(wf.id);
            });

            var hourSel = document.getElementById('hour-sel-' + wf.id);
            var minSel = document.getElementById('min-sel-' + wf.id);
            hourSel.addEventListener('change', function () {
                editorStates[wf.id].hour = parseInt(hourSel.value);
                refreshCronDisplay(wf.id);
            });
            minSel.addEventListener('change', function () {
                editorStates[wf.id].minute = parseInt(minSel.value);
                refreshCronDisplay(wf.id);
            });
        }

        function syncUIFromState(wfId) {
            var state = editorStates[wfId];
            document.querySelectorAll('#freq-tabs-' + wfId + ' .freq-tab').forEach(function (t) {
                t.classList.toggle('selected', t.dataset.freq === state.freq);
            });
            document.getElementById('dow-row-' + wfId).style.display = state.freq === FREQ_WEEKLY ? 'flex' : 'none';
            document.getElementById('dom-row-' + wfId).style.display = state.freq === FREQ_MONTHLY ? 'flex' : 'none';
            document.querySelectorAll('#dow-row-' + wfId + ' .dow-btn').forEach(function (b) {
                b.classList.toggle('selected', parseInt(b.dataset.dow) === state.dow);
            });
            var domSel = document.getElementById('dom-select-' + wfId);
            if (domSel) domSel.value = String(state.dom);
            document.getElementById('hour-sel-' + wfId).value = String(state.hour);
            document.getElementById('min-sel-' + wfId).value = String(state.minute);
        }

        // ── 스케줄 그룹 관리 ──────────────────────────────

        var allBranches = [];
        var groupTargets = {};  // groupId → Set of branch_ids
        var groupSorts = {};    // groupId → sort mode

        async function ensureBranches() {
            if (allBranches.length > 0) return;
            try {
                var result = await apiRequest(API_PREFIX + '/n8n/scheduler/branches');
                allBranches = result.data || [];
            } catch (e) {
                console.error('branches load failed', e);
            }
        }

        async function loadGroups(wfId) {
            var container = document.getElementById('groups-' + wfId);
            if (!container) return;

            await ensureBranches();

            try {
                var result = await apiRequest(API_PREFIX + '/n8n/scheduler/groups/' + wfId);
                renderGroups(wfId, result.data || []);
            } catch (e) {
                container.textContent = '';
                container.appendChild(el('div', { className: 'error-banner' }, ['그룹 로드 실패']));
            }
        }

        function renderGroups(wfId, groups) {
            var container = document.getElementById('groups-' + wfId);
            container.textContent = '';

            // Header
            var addBtn = el('button', { className: 'btn-add-group', textContent: '+ 그룹 추가' });
            addBtn.addEventListener('click', function () { createGroup(wfId); });

            container.appendChild(el('div', { className: 'groups-header' }, [
                el('span', { className: 'groups-title', textContent: '스케줄 그룹' }),
                addBtn
            ]));

            if (groups.length === 0) {
                container.appendChild(el('div', { className: 'groups-empty' },
                    ['아직 스케줄 그룹이 없습니다. "그룹 추가"를 눌러 지점별 스케줄을 설정하세요.']));
                return;
            }

            groups.forEach(function (group) {
                // 그룹별 타겟 상태 초기화
                var targetIds = (group.targets || []).map(function (t) { return t.branch_id; });
                groupTargets[group.id] = new Set(targetIds);
                groupSorts[group.id] = 'reviews';

                container.appendChild(buildGroupCard(group, wfId));
            });
        }

        function buildGroupCard(group, wfId) {
            var gid = group.id;
            var targetCount = group.target_count || 0;

            // Header
            var badge = el('span', {
                className: 'group-badge' + (targetCount > 0 ? ' has-targets' : ''),
                id: 'gbadge-' + gid,
                textContent: targetCount > 0 ? targetCount + '개 지점' : '미설정'
            });

            var headerEl = el('div', { className: 'group-card-header', id: 'gheader-' + gid }, [
                el('span', { className: 'group-name', textContent: group.group_name }),
                el('span', { className: 'group-meta', textContent: group.cron_description || '' }),
                badge
            ]);

            // Body
            var nameInput = el('input', {
                type: 'text', className: 'group-name-input', id: 'gname-' + gid,
                value: group.group_name, placeholder: '그룹 이름'
            });

            // Mini cron editor for the group
            var cronSection = buildGroupCronEditor(gid, group.cron_expression || '0 6 * * *');

            // Branch list
            var searchInput = el('input', {
                type: 'text', className: 'targets-search', id: 'gsearch-' + gid,
                placeholder: '지점명 또는 지역으로 검색...'
            });
            var toolbar = el('div', { className: 'targets-toolbar' }, [searchInput]);

            var sortRow = el('div', { className: 'targets-sort', id: 'gsort-' + gid });
            [{ key: 'reviews', label: '리뷰 많은순' }, { key: 'selected', label: '선택순' }, { key: 'name', label: '이름순' }]
                .forEach(function (s) {
                    var btn = el('button', { className: 'sort-btn' + (s.key === 'reviews' ? ' active' : ''), textContent: s.label });
                    btn.dataset.sort = s.key;
                    sortRow.appendChild(btn);
                });

            var listContainer = el('div', { className: 'targets-list', id: 'glist-' + gid });

            // Actions
            var saveBtn = el('button', { className: 'btn-save-group', id: 'gsave-' + gid, textContent: '그룹 저장' });
            var deleteBtn = el('button', { className: 'btn-delete-group', id: 'gdel-' + gid, textContent: '삭제' });
            var actionsRow = el('div', { className: 'group-actions' }, [saveBtn, deleteBtn]);

            var body = el('div', { className: 'group-body', id: 'gbody-' + gid }, [
                nameInput, cronSection, toolbar, sortRow, listContainer, actionsRow
            ]);

            var card = el('div', { className: 'group-card', id: 'gcard-' + gid }, [headerEl, body]);

            // Bind events after DOM insertion using setTimeout
            setTimeout(function () { bindGroupCardEvents(gid, wfId); }, 0);

            return card;
        }

        // ── 그룹별 미니 크론 에디터 ──────────────────────

        var groupCronStates = {};

        function buildGroupCronEditor(gid, cronExpr) {
            var state = parseCronToUI(cronExpr);
            groupCronStates[gid] = state;

            var section = el('div', { className: 'group-cron-section' });

            // Freq tabs
            var tabs = el('div', { className: 'freq-tabs', id: 'gfreq-' + gid });
            [{ key: FREQ_DAILY, label: '매일' }, { key: FREQ_WEEKLY, label: '매주' }, { key: FREQ_MONTHLY, label: '매월' }]
                .forEach(function (f) {
                    var tab = el('button', { className: 'freq-tab' + (state.freq === f.key ? ' selected' : ''), textContent: f.label });
                    tab.dataset.freq = f.key;
                    tabs.appendChild(tab);
                });
            section.appendChild(tabs);

            // DOW
            var dowRow = el('div', { className: 'dow-row', id: 'gdow-' + gid });
            if (state.freq !== FREQ_WEEKLY) dowRow.style.display = 'none';
            DOW_LABELS.forEach(function (label, i) {
                var btn = el('button', { className: 'dow-btn' + (state.dow === i ? ' selected' : ''), textContent: label });
                btn.dataset.dow = String(i);
                dowRow.appendChild(btn);
            });
            section.appendChild(dowRow);

            // DOM
            var domSelect = el('select', { className: 'dom-select', id: 'gdom-' + gid });
            for (var d = 1; d <= 31; d++) {
                var opt = el('option', { value: String(d), textContent: d + '일' });
                if (d === state.dom) opt.selected = true;
                domSelect.appendChild(opt);
            }
            var domRow = el('div', { className: 'dom-row', id: 'gdomrow-' + gid }, [
                el('span', { className: 'dom-label', textContent: '매월' }), domSelect,
                el('span', { className: 'dom-label', textContent: '에 실행' })
            ]);
            if (state.freq !== FREQ_MONTHLY) domRow.style.display = 'none';
            section.appendChild(domRow);

            // Time
            var hourSel = el('select', { className: 'time-select', id: 'ghour-' + gid });
            for (var h = 0; h < 24; h++) {
                var hOpt = el('option', { value: String(h), textContent: String(h).padStart(2, '0') });
                if (h === state.hour) hOpt.selected = true;
                hourSel.appendChild(hOpt);
            }
            var minSel = el('select', { className: 'time-select', id: 'gmin-' + gid });
            [0, 5, 10, 15, 20, 30, 45].forEach(function (m) {
                var mOpt = el('option', { value: String(m), textContent: String(m).padStart(2, '0') });
                if (m === state.minute) mOpt.selected = true;
                minSel.appendChild(mOpt);
            });
            section.appendChild(el('div', { className: 'time-row' }, [
                el('span', { className: 'time-label', textContent: '실행 시각' }),
                hourSel, el('span', { className: 'time-colon', textContent: ':' }), minSel
            ]));

            return section;
        }

        function refreshGroupCron(gid) {
            var state = groupCronStates[gid];
            var expr = uiToCron(state);
            var display = document.getElementById('gcron-' + gid);
            if (display) display.textContent = expr;
        }

        // ── 그룹 카드 이벤트 ──────────────────────────────

        function bindGroupCardEvents(gid, wfId) {
            // Toggle
            var header = document.getElementById('gheader-' + gid);
            var body = document.getElementById('gbody-' + gid);
            if (header) header.addEventListener('click', function () { body.classList.toggle('open'); });

            // Group cron editor events
            document.querySelectorAll('#gfreq-' + gid + ' .freq-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('#gfreq-' + gid + ' .freq-tab').forEach(function (t) { t.classList.remove('selected'); });
                    tab.classList.add('selected');
                    groupCronStates[gid].freq = tab.dataset.freq;
                    var gdow = document.getElementById('gdow-' + gid);
                    var gdomrow = document.getElementById('gdomrow-' + gid);
                    if (gdow) gdow.style.display = tab.dataset.freq === FREQ_WEEKLY ? 'flex' : 'none';
                    if (gdomrow) gdomrow.style.display = tab.dataset.freq === FREQ_MONTHLY ? 'flex' : 'none';
                    refreshGroupCron(gid);
                });
            });

            document.querySelectorAll('#gdow-' + gid + ' .dow-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('#gdow-' + gid + ' .dow-btn').forEach(function (b) { b.classList.remove('selected'); });
                    btn.classList.add('selected');
                    groupCronStates[gid].dow = parseInt(btn.dataset.dow);
                    refreshGroupCron(gid);
                });
            });

            var gdom = document.getElementById('gdom-' + gid);
            if (gdom) gdom.addEventListener('change', function () {
                groupCronStates[gid].dom = parseInt(gdom.value);
                refreshGroupCron(gid);
            });

            var ghour = document.getElementById('ghour-' + gid);
            var gmin = document.getElementById('gmin-' + gid);
            if (ghour) ghour.addEventListener('change', function () {
                groupCronStates[gid].hour = parseInt(ghour.value);
                refreshGroupCron(gid);
            });
            if (gmin) gmin.addEventListener('change', function () {
                groupCronStates[gid].minute = parseInt(gmin.value);
                refreshGroupCron(gid);
            });

            // Sort buttons
            document.querySelectorAll('#gsort-' + gid + ' .sort-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('#gsort-' + gid + ' .sort-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    groupSorts[gid] = btn.dataset.sort;
                    var search = document.getElementById('gsearch-' + gid);
                    renderGroupBranchList(gid, search ? search.value : '');
                });
            });

            // Search
            var searchInput = document.getElementById('gsearch-' + gid);
            if (searchInput) searchInput.addEventListener('input', debounce(function () {
                renderGroupBranchList(gid, searchInput.value);
            }, 250));

            // Save / Delete
            var saveBtn = document.getElementById('gsave-' + gid);
            if (saveBtn) saveBtn.addEventListener('click', function () { saveGroup(gid, wfId); });

            var delBtn = document.getElementById('gdel-' + gid);
            if (delBtn) delBtn.addEventListener('click', function () { deleteGroup(gid, wfId); });

            // Render initial branch list
            renderGroupBranchList(gid, '');
        }

        function renderGroupBranchList(gid, filter) {
            var container = document.getElementById('glist-' + gid);
            if (!container) return;
            container.textContent = '';

            var selected = groupTargets[gid] || new Set();
            var q = (filter || '').toLowerCase();

            var filtered = allBranches.filter(function (b) {
                if (!q) return true;
                return (b.branch_name || '').toLowerCase().indexOf(q) !== -1
                    || (b.region || '').toLowerCase().indexOf(q) !== -1;
            });

            if (filtered.length === 0) {
                container.appendChild(el('div', { style: { padding: '12px', textAlign: 'center', color: '#999', fontSize: '13px' }, textContent: '검색 결과 없음' }));
                return;
            }

            var mode = groupSorts[gid] || 'reviews';
            filtered.sort(function (a, b) {
                if (mode === 'selected') {
                    var ac = selected.has(a.branch_id) ? 0 : 1;
                    var bc = selected.has(b.branch_id) ? 0 : 1;
                    if (ac !== bc) return ac - bc;
                    return (b.review_count || 0) - (a.review_count || 0);
                }
                if (mode === 'reviews') return (b.review_count || 0) - (a.review_count || 0);
                return (a.branch_name || '').localeCompare(b.branch_name || '');
            });

            var toRender = filtered.slice(0, 200);
            toRender.forEach(function (b) {
                var cb = el('input', { type: 'checkbox' });
                cb.checked = selected.has(b.branch_id);
                cb.dataset.bid = String(b.branch_id);

                var item = el('div', { className: 'target-item' }, [
                    cb,
                    el('span', { className: 'target-name', textContent: b.branch_name || '(이름 없음)' }),
                    el('span', { className: 'target-meta', textContent: (b.region || '') + ' · ' + (b.review_count || 0) + '건' })
                ]);

                item.addEventListener('click', function (e) {
                    if (e.target === cb) return;
                    cb.checked = !cb.checked;
                    cb.dispatchEvent(new Event('change'));
                });

                cb.addEventListener('change', function () {
                    if (cb.checked) selected.add(b.branch_id);
                    else selected.delete(b.branch_id);
                    updateGroupBadge(gid);
                });

                container.appendChild(item);
            });

            if (filtered.length > 200) {
                container.appendChild(el('div', { style: { padding: '8px', textAlign: 'center', color: '#999', fontSize: '11px' },
                    textContent: '검색어를 입력하여 범위를 좁혀주세요 (' + filtered.length + '개 중 200개 표시)' }));
            }
        }

        function updateGroupBadge(gid) {
            var badge = document.getElementById('gbadge-' + gid);
            if (!badge) return;
            var count = (groupTargets[gid] || new Set()).size;
            badge.textContent = count > 0 ? count + '개 지점' : '미설정';
            badge.className = 'group-badge' + (count > 0 ? ' has-targets' : '');
        }

        // ── 그룹 CRUD ──────────────────────────────────

        async function createGroup(wfId) {
            try {
                await apiRequest(API_PREFIX + '/n8n/scheduler/groups/' + wfId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_name: '새 그룹', cron_expression: '0 6 * * *', branch_ids: [] }),
                });
                showToast('그룹이 추가되었습니다', 'success');
                await loadGroups(wfId);
            } catch (e) {
                showToast('그룹 추가 실패: ' + (e.message || ''), 'error');
            }
        }

        async function saveGroup(gid, wfId) {
            var btn = document.getElementById('gsave-' + gid);
            btn.disabled = true;
            btn.textContent = '저장 중...';

            try {
                var nameInput = document.getElementById('gname-' + gid);
                var cronState = groupCronStates[gid];
                var ids = Array.from(groupTargets[gid] || new Set());

                await apiRequest(API_PREFIX + '/n8n/scheduler/groups/' + gid, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        group_name: nameInput ? nameInput.value : null,
                        cron_expression: cronState ? uiToCron(cronState) : null,
                        branch_ids: ids,
                    }),
                });
                showToast('그룹이 저장되었습니다', 'success');
                await loadGroups(wfId);
            } catch (e) {
                showToast('그룹 저장 실패: ' + (e.message || ''), 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '그룹 저장';
            }
        }

        async function deleteGroup(gid, wfId) {
            if (!confirm('이 스케줄 그룹을 삭제하시겠습니까?')) return;

            try {
                await apiRequest(API_PREFIX + '/n8n/scheduler/groups/' + gid, { method: 'DELETE' });
                showToast('그룹이 삭제되었습니다', 'success');
                await loadGroups(wfId);
            } catch (e) {
                showToast('그룹 삭제 실패: ' + (e.message || ''), 'error');
            }
        }

        // ── API 호출 함수들 ──────────────────────────────

        async function validateCron(wfId, expression) {
            var valEl = document.getElementById('cron-validation-' + wfId);
            if (!valEl) return;

            if (!expression || !expression.trim()) {
                valEl.textContent = '';
                valEl.className = 'cron-validation';
                return;
            }

            try {
                var result = await apiRequest(API_PREFIX + '/n8n/scheduler/cron/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expression: expression.trim() }),
                });
                var d = result.data;
                if (d.valid) {
                    valEl.textContent = d.description + ' — 다음 실행: ' + (d.next_runs[0] || '');
                    valEl.className = 'cron-validation valid';
                } else {
                    valEl.textContent = d.error;
                    valEl.className = 'cron-validation invalid';
                }
            } catch (e) {
                valEl.textContent = '검증 실패';
                valEl.className = 'cron-validation invalid';
            }
        }

        async function updateSchedule(wfId) {
            var btn = document.getElementById('btn-save-' + wfId);
            var expr = uiToCron(editorStates[wfId]);
            btn.disabled = true;
            btn.textContent = '저장 중...';
            try {
                var result = await apiRequest(API_PREFIX + '/n8n/scheduler/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflow_id: wfId, cron_expression: expr }),
                });
                showToast(result.data.message, 'success');
                await loadWorkflows();
            } catch (e) {
                showToast('스케줄 변경 실패: ' + (e.message || ''), 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '스케줄 저장';
            }
        }

        async function toggleWorkflow(wfId) {
            var btn = document.getElementById('btn-toggle-' + wfId);
            var currentlyActive = btn.dataset.active === 'true';
            var newActive = !currentlyActive;
            var action = newActive ? '활성화' : '비활성화';
            if (!confirm('이 워크플로를 ' + action + '하시겠습니까?')) return;
            btn.disabled = true;
            try {
                var result = await apiRequest(API_PREFIX + '/n8n/scheduler/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflow_id: wfId, active: newActive }),
                });
                showToast(result.data.message, 'success');
                await loadWorkflows();
            } catch (e) {
                showToast('상태 변경 실패: ' + (e.message || ''), 'error');
            } finally {
                btn.disabled = false;
            }
        }

    </script>
</body>

</html>
