<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Console - Review Summary AI</title>
    <link rel="stylesheet" href="{{ base_path }}/static/css/shared-theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        /* Page-specific overrides */
        .page-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--grey-1);
        }

        /* Section layout */
        .section {
            margin-bottom: var(--spacing-lg);
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--grey-2);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .badge {
            font-size: 10px;
        }

        /* Form row */
        .form-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: var(--spacing-md);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--grey-3);
        }
        .form-group input, .form-group select {
            min-width: 140px;
        }

        /* Progress bar */
        .progress-wrap {
            display: none;
            margin-top: var(--spacing-md);
        }
        .progress-wrap.active {
            display: block;
        }
        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: var(--grey-8);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-text {
            font-size: 12px;
            color: var(--grey-3);
            margin-top: 6px;
        }
        .progress-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        /* Drop zone */
        .drop-zone {
            border: 2px dashed var(--grey-7);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--grey-9);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .drop-zone-text {
            font-size: 14px;
            color: var(--grey-3);
        }
        .drop-zone-hint {
            font-size: 12px;
            color: var(--grey-5);
            margin-top: 4px;
        }

        /* Config grid */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-md);
        }
        .config-card {
            background: var(--grey-9);
            border-radius: var(--radius-sm);
            padding: var(--spacing-md);
            border: 1px solid var(--grey-7);
        }
        .config-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid var(--grey-7);
        }
        .config-item:last-child {
            border-bottom: none;
        }
        .config-key {
            font-size: 12px;
            color: var(--grey-3);
        }
        .config-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--grey-1);
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        /* Hidden file input */
        .file-input-hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>Pipeline Console</h1>
        <div class="header-actions">
            <button class="btn btn-header-nav" id="btn-back-dashboard">대시보드</button>
        </div>
    </header>

    <div class="container">
        <div class="page-title-row">
            <div class="page-title">파이프라인 관리</div>
        </div>

        <!-- Section A: Athena Pipeline -->
        <div class="section">
            <div class="section-title">
                Athena Pipeline
                <span class="badge badge-primary">Sync</span>
            </div>
            <div class="card">
                <div class="form-row">
                    <div class="form-group">
                        <label>시작일</label>
                        <input type="text" id="date-from" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="form-group">
                        <label>종료일</label>
                        <input type="text" id="date-to" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="form-group">
                        <label>청크 크기</label>
                        <input type="number" id="chunk-size" value="500" min="100" max="2000" step="100">
                    </div>
                    <div class="btn-group" style="margin-bottom: 1px;">
                        <button class="btn btn-secondary" id="btn-sync-incremental">증분 실행</button>
                        <button class="btn btn-primary" id="btn-sync-full">전체 실행</button>
                    </div>
                </div>
                <div class="progress-wrap" id="athena-progress">
                    <div class="progress-bar-outer">
                        <div class="progress-bar-fill" id="athena-progress-fill"></div>
                    </div>
                    <div class="progress-text" id="athena-progress-text">준비 중...</div>
                    <div class="progress-actions">
                        <button class="btn btn-danger" id="btn-athena-cancel" style="font-size:12px; padding:4px 12px;">취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section B: CSV Upload -->
        <div class="section">
            <div class="section-title">
                CSV / Excel Upload
                <span class="badge badge-success">Upload</span>
            </div>
            <div class="card">
                <div class="drop-zone" id="upload-drop-zone">
                    <div class="drop-zone-text">파일을 드래그하거나 클릭하여 업로드</div>
                    <div class="drop-zone-hint">.csv, .xlsx 파일 지원</div>
                    <input type="file" class="file-input-hidden" id="file-input" accept=".csv,.xlsx">
                </div>
                <div class="progress-wrap" id="upload-progress">
                    <div class="progress-bar-outer">
                        <div class="progress-bar-fill" id="upload-progress-fill"></div>
                    </div>
                    <div class="progress-text" id="upload-progress-text">업로드 준비 중...</div>
                    <div class="progress-actions">
                        <button class="btn btn-danger" id="btn-upload-cancel" style="font-size:12px; padding:4px 12px;">취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section C: Configuration Panel -->
        <div class="section">
            <div class="section-title">
                Configuration
                <span class="badge badge-warning">Read-only</span>
            </div>
            <div class="card">
                <div class="config-grid" id="config-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ base_path }}/static/js/shared-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        const API_PREFIX = '{{ api_prefix }}';
        const BASE_PATH = '{{ base_path }}';

        // =============================================
        // 초기화
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            initFlatpickr();
            bindEvents();
            loadConfig();
        });

        function initFlatpickr() {
            flatpickr('#date-from', { dateFormat: 'Y-m-d' });
            flatpickr('#date-to', { dateFormat: 'Y-m-d' });
        }

        // =============================================
        // 이벤트 바인딩
        // =============================================
        function bindEvents() {
            // 네비게이션
            document.getElementById('btn-back-dashboard').addEventListener('click', function() {
                window.location.href = BASE_PATH + '/';
            });

            // Athena 증분 실행
            document.getElementById('btn-sync-incremental').addEventListener('click', runIncrementalSync);

            // Athena 전체 실행
            document.getElementById('btn-sync-full').addEventListener('click', runFullPipeline);

            // Athena 취소
            document.getElementById('btn-athena-cancel').addEventListener('click', cancelAthenaJob);

            // CSV 업로드
            const dropZone = document.getElementById('upload-drop-zone');
            const fileInput = document.getElementById('file-input');

            dropZone.addEventListener('click', function() { fileInput.click(); });
            dropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', function() {
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFileUpload(e.dataTransfer.files[0]);
                }
            });
            fileInput.addEventListener('change', function() {
                if (fileInput.files.length > 0) {
                    handleFileUpload(fileInput.files[0]);
                    fileInput.value = '';
                }
            });

            // 업로드 취소
            document.getElementById('btn-upload-cancel').addEventListener('click', cancelUploadJob);
        }

        // =============================================
        // Section A: Athena Pipeline
        // =============================================
        let athenaAbortController = null;
        let athenaJobId = null;

        function setAthenaButtonsDisabled(disabled) {
            document.getElementById('btn-sync-incremental').disabled = disabled;
            document.getElementById('btn-sync-full').disabled = disabled;
        }

        function showAthenaProgress(show) {
            const wrap = document.getElementById('athena-progress');
            if (show) {
                wrap.classList.add('active');
            } else {
                wrap.classList.remove('active');
            }
        }

        function updateAthenaProgress(pct, msg) {
            const fill = document.getElementById('athena-progress-fill');
            const text = document.getElementById('athena-progress-text');
            if (fill) fill.style.width = pct + '%';
            if (text) text.textContent = msg || (pct + '%');
        }

        // --- 증분 실행 (기존 sync API) ---
        async function runIncrementalSync() {
            setAthenaButtonsDisabled(true);
            showAthenaProgress(true);
            updateAthenaProgress(10, '증분 동기화 준비 중...');

            athenaAbortController = new AbortController();

            try {
                const submitRes = await fetch(API_PREFIX + '/sync/reviews', {
                    method: 'POST',
                    signal: athenaAbortController.signal,
                });

                if (!submitRes.ok) {
                    const err = await submitRes.json().catch(function() { return {}; });
                    throw new Error(err.detail || '동기화 제출 실패 (' + submitRes.status + ')');
                }

                const submitBody = await submitRes.json();
                const jobId = submitBody && submitBody.data ? submitBody.data.job_id : null;
                if (!jobId) throw new Error('작업 ID를 받지 못했습니다.');

                athenaJobId = jobId;
                updateAthenaProgress(20, '증분 동기화 진행 중...');

                await pollSyncJob(jobId);

            } catch (e) {
                if (e.name === 'AbortError') {
                    showToast('증분 동기화가 취소되었습니다.', 'warning');
                } else {
                    showToast(e.message, 'error');
                }
            } finally {
                athenaAbortController = null;
                athenaJobId = null;
                setAthenaButtonsDisabled(false);
                setTimeout(function() { showAthenaProgress(false); }, 2000);
            }
        }

        async function pollSyncJob(jobId) {
            let pollCount = 0;
            while (pollCount < 60) {
                await sleep(2000);
                pollCount++;

                const res = await fetch(API_PREFIX + '/sync/jobs/' + encodeURIComponent(jobId), {
                    signal: athenaAbortController.signal,
                });
                if (res.status === 404) break;
                if (!res.ok) continue;

                const body = await res.json();
                const job = body.data || body;
                updateAthenaProgress(job.progress || 0, job.message || '진행 중...');

                if (job.status === 'completed') {
                    updateAthenaProgress(100, job.message || '완료');
                    showToast('증분 동기화 완료', 'success');
                    return;
                }
                if (job.status === 'failed') {
                    throw new Error(job.error || '동기화 실패');
                }
            }
        }

        // --- 전체 실행 (새 pipeline API) ---
        async function runFullPipeline() {
            setAthenaButtonsDisabled(true);
            showAthenaProgress(true);
            updateAthenaProgress(5, '전체 재처리 준비 중...');

            athenaAbortController = new AbortController();

            try {
                const dateFrom = document.getElementById('date-from').value || null;
                const dateTo = document.getElementById('date-to').value || null;
                const chunkSize = parseInt(document.getElementById('chunk-size').value, 10) || 500;

                const payload = {
                    date_from: dateFrom,
                    date_to: dateTo,
                    chunk_size: chunkSize,
                };

                const submitRes = await fetch(API_PREFIX + '/pipeline/run-full', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: athenaAbortController.signal,
                });

                if (!submitRes.ok) {
                    const err = await submitRes.json().catch(function() { return {}; });
                    throw new Error(err.detail || '전체 실행 제출 실패 (' + submitRes.status + ')');
                }

                const submitBody = await submitRes.json();
                const jobId = submitBody.job_id;
                if (!jobId) throw new Error('작업 ID를 받지 못했습니다.');

                athenaJobId = jobId;
                updateAthenaProgress(10, '전체 재처리 시작...');

                await pollPipelineJob(jobId);

            } catch (e) {
                if (e.name === 'AbortError') {
                    showToast('전체 재처리가 취소되었습니다.', 'warning');
                } else {
                    showToast(e.message, 'error');
                }
            } finally {
                athenaAbortController = null;
                athenaJobId = null;
                setAthenaButtonsDisabled(false);
                setTimeout(function() { showAthenaProgress(false); }, 2000);
            }
        }

        async function pollPipelineJob(jobId) {
            let pollCount = 0;
            while (pollCount < 60) {
                await sleep(2000);
                pollCount++;

                const res = await fetch(API_PREFIX + '/pipeline/jobs/' + encodeURIComponent(jobId), {
                    signal: athenaAbortController.signal,
                });
                if (res.status === 404) break;
                if (!res.ok) continue;

                const job = await res.json();
                updateAthenaProgress(job.progress || 0, job.message || '진행 중...');

                if (job.status === 'completed') {
                    updateAthenaProgress(100, job.message || '완료');
                    showToast('전체 재처리 완료', 'success');
                    return;
                }
                if (job.status === 'failed') {
                    throw new Error(job.error || '전체 재처리 실패');
                }
            }
        }

        async function cancelAthenaJob() {
            // AbortController로 폴링 중단
            if (athenaAbortController) {
                athenaAbortController.abort();
            }
            // 서버 작업 취소 (pipeline job이 있으면)
            if (athenaJobId) {
                try {
                    await fetch(API_PREFIX + '/pipeline/jobs/' + encodeURIComponent(athenaJobId), {
                        method: 'DELETE',
                    });
                } catch (_) { /* ignore */ }
            }
            showAthenaProgress(false);
            setAthenaButtonsDisabled(false);
            showToast('작업이 취소되었습니다.', 'warning');
        }

        // =============================================
        // Section B: CSV Upload
        // =============================================
        let uploadAbortController = null;
        let uploadJobId = null;

        function showUploadProgress(show) {
            const wrap = document.getElementById('upload-progress');
            if (show) {
                wrap.classList.add('active');
            } else {
                wrap.classList.remove('active');
            }
        }

        function updateUploadProgress(pct, msg) {
            const fill = document.getElementById('upload-progress-fill');
            const text = document.getElementById('upload-progress-text');
            if (fill) fill.style.width = pct + '%';
            if (text) text.textContent = msg || (pct + '%');
        }

        async function handleFileUpload(file) {
            const name = file.name.toLowerCase();
            if (!name.endsWith('.csv') && !name.endsWith('.xlsx')) {
                showToast('.csv 또는 .xlsx 파일만 지원합니다.', 'error');
                return;
            }

            showUploadProgress(true);
            updateUploadProgress(5, '파일 업로드 중...');

            uploadAbortController = new AbortController();

            try {
                const formData = new FormData();
                formData.append('file', file);

                const submitRes = await fetch(API_PREFIX + '/upload/reviews', {
                    method: 'POST',
                    body: formData,
                    signal: uploadAbortController.signal,
                });

                if (!submitRes.ok) {
                    const err = await submitRes.json().catch(function() { return {}; });
                    throw new Error(err.detail || '업로드 실패 (' + submitRes.status + ')');
                }

                const submitBody = await submitRes.json();
                const jobId = submitBody && submitBody.data ? submitBody.data.job_id : null;
                if (!jobId) throw new Error('업로드 작업 ID를 받지 못했습니다.');

                uploadJobId = jobId;
                updateUploadProgress(15, '파일 처리 시작...');

                // 폴링
                let pollCount = 0;
                while (pollCount < 60) {
                    await sleep(2000);
                    pollCount++;

                    const res = await fetch(API_PREFIX + '/upload/jobs/' + encodeURIComponent(jobId), {
                        signal: uploadAbortController.signal,
                    });
                    if (res.status === 404) break;
                    if (!res.ok) continue;

                    const body = await res.json();
                    const job = body.data || body;
                    updateUploadProgress(job.progress || 0, job.message || '처리 중...');

                    if (job.status === 'completed') {
                        updateUploadProgress(100, job.message || '완료');
                        showToast('업로드 처리 완료', 'success');
                        return;
                    }
                    if (job.status === 'failed') {
                        throw new Error(job.error || '업로드 처리 실패');
                    }
                }

            } catch (e) {
                if (e.name === 'AbortError') {
                    showToast('업로드가 취소되었습니다.', 'warning');
                } else {
                    showToast(e.message, 'error');
                }
            } finally {
                uploadAbortController = null;
                uploadJobId = null;
                setTimeout(function() { showUploadProgress(false); }, 2000);
            }
        }

        async function cancelUploadJob() {
            if (uploadAbortController) {
                uploadAbortController.abort();
            }
            if (uploadJobId) {
                try {
                    await fetch(API_PREFIX + '/upload/jobs/' + encodeURIComponent(uploadJobId), {
                        method: 'DELETE',
                    });
                } catch (_) { /* ignore */ }
            }
            showUploadProgress(false);
            showToast('업로드가 취소되었습니다.', 'warning');
        }

        // =============================================
        // Section C: Configuration
        // =============================================

        // 카테고리별 한글 레이블
        const CONFIG_LABELS = {
            embedding: '임베딩',
            rating: '평점 임계값',
            report: '리포트',
            cache: '캐시 무효화',
            decay: '시간 감쇠',
            pipeline: '파이프라인',
        };

        async function loadConfig() {
            const grid = document.getElementById('config-grid');
            try {
                const data = await apiRequest(API_PREFIX + '/pipeline/config');
                renderConfigGrid(grid, data);
            } catch (e) {
                const errMsg = document.createElement('div');
                errMsg.textContent = '설정을 불러올 수 없습니다: ' + e.message;
                errMsg.style.color = 'var(--error)';
                errMsg.style.fontSize = '13px';
                grid.appendChild(errMsg);
            }
        }

        function renderConfigGrid(container, data) {
            // 기존 내용 제거
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            const groups = Object.keys(data);
            for (let i = 0; i < groups.length; i++) {
                var groupKey = groups[i];
                var groupData = data[groupKey];
                var card = createConfigCard(groupKey, groupData);
                container.appendChild(card);
            }
        }

        function createConfigCard(groupKey, groupData) {
            var card = document.createElement('div');
            card.className = 'config-card';

            var title = document.createElement('div');
            title.className = 'config-card-title';
            title.textContent = CONFIG_LABELS[groupKey] || groupKey;
            card.appendChild(title);

            var keys = Object.keys(groupData);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                var value = groupData[key];

                var item = document.createElement('div');
                item.className = 'config-item';

                var keyEl = document.createElement('span');
                keyEl.className = 'config-key';
                keyEl.textContent = key;

                var valueEl = document.createElement('span');
                valueEl.className = 'config-value';
                valueEl.textContent = String(value);

                item.appendChild(keyEl);
                item.appendChild(valueEl);
                card.appendChild(item);
            }

            return card;
        }

        // =============================================
        // 유틸
        // =============================================
        function sleep(ms) {
            return new Promise(function(resolve) { setTimeout(resolve, ms); });
        }
    </script>
</body>
</html>
