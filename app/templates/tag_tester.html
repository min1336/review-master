<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그 분석 테스트 - Review Summary AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ base_path }}/static/css/shared-theme.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Card */
        .card {
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--grey-3);
        }

        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea::placeholder {
            color: var(--grey-5);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        /* Results */
        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-section {
            margin-bottom: 24px;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--grey-3);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .tag.positive {
            background: #dcfce7;
            color: #166534;
        }

        .tag.negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .tag.neutral {
            background: var(--grey-8);
            color: var(--grey-3);
        }

        .tag-count {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
        }

        /* Keywords */
        .keywords-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--grey-8);
            border-radius: 4px;
            font-size: 13px;
        }

        .keyword-sentiment {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .keyword-sentiment.positive {
            background: var(--success);
        }

        .keyword-sentiment.negative {
            background: var(--error);
        }

        .keyword-sentiment.neutral {
            background: var(--grey-5);
        }

        /* Tag Groups */
        .tag-group {
            background: var(--grey-9);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
        }

        .tag-group:last-child {
            margin-bottom: 0;
        }

        .tag-group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .tag-group-name {
            font-weight: 600;
            font-size: 15px;
        }

        .tag-group-sentiment {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .tag-group-sentiment.positive {
            background: #dcfce7;
            color: #166534;
        }

        .tag-group-sentiment.negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .tag-group-sentiment.neutral {
            background: var(--grey-8);
            color: var(--grey-3);
        }

        .tag-group-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-group-keyword {
            font-size: 12px;
            padding: 2px 8px;
            background: white;
            border-radius: 4px;
            color: var(--grey-3);
        }

        /* Loading */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 32px;
            height: 32px;
        }

        /* Summary */
        .summary-text {
            background: var(--grey-9);
            padding: 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        /* Examples */
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .example-btn {
            padding: 6px 12px;
            background: var(--grey-8);
            border: none;
            border-radius: 4px;
            font-size: 12px;
            color: var(--grey-3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: var(--grey-7);
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>태그 분석 테스트</h1>
        <div class="header-actions">
            <button class="btn btn-ghost" id="btn-back">돌아가기</button>
        </div>
    </header>

    <div class="container">
        <!-- Input Section -->
        <div class="card">
            <div class="card-title">리뷰 입력</div>
            <div class="form-group">
                <label class="form-label">분석할 리뷰 텍스트를 입력하세요</label>
                <textarea id="reviewInput"
                    placeholder="예: 직원분이 정말 친절하시고 차량도 깨끗했어요. 가격도 합리적이라 만족합니다. 다만 주차장 위치를 찾기가 조금 어려웠어요."></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="analyzeReview()" id="analyzeBtn">분석하기</button>
                <button class="btn btn-secondary" onclick="clearAll()">초기화</button>
            </div>
            <div class="examples">
                <span style="font-size: 12px; color: var(--grey-5); margin-right: 8px;">예시:</span>
                <button class="example-btn" onclick="setExample(1)">긍정 리뷰</button>
                <button class="example-btn" onclick="setExample(2)">부정 리뷰</button>
                <button class="example-btn" onclick="setExample(3)">혼합 리뷰</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <!-- Results Section -->
        <div class="results" id="results">
            <!-- Keywords -->
            <div class="card">
                <div class="card-title">추출된 키워드</div>
                <div class="keywords-list" id="keywordsList"></div>
            </div>

            <!-- Tag Groups -->
            <div class="card">
                <div class="card-title">태그별 분류</div>
                <div id="tagGroups"></div>
            </div>

            <!-- Summary Stats -->
            <div class="card">
                <div class="card-title">분석 요약</div>
                <div class="summary-text" id="summaryStats"></div>
            </div>
        </div>
    </div>

    <script src="{{ base_path }}/static/js/shared-utils.js"></script>
    <script>
        // API Prefix (서버에서 Jinja2로 주입)
        const API_PREFIX = '{{ api_prefix }}';
        // 페이지 경로용 base path
        const BASE_PATH = API_PREFIX.replace('/api', '');

        // 헤더 네비게이션 버튼
        document.addEventListener('DOMContentLoaded', () => {
            const btnBack = document.getElementById('btn-back');
            if (btnBack) {
                btnBack.addEventListener('click', () => {
                    window.location.href = `${BASE_PATH}/`;
                });
            }
        });

        const EXAMPLES = {
            1: "직원분들이 정말 친절하시고 설명도 자세히 해주셨어요. 차량도 신차급으로 깨끗하고 컨디션이 좋았습니다. 가격도 합리적이고 픽업 반납도 편리해서 다음에도 이용할 예정입니다. 감사합니다!",
            2: "차량에서 담배 냄새가 심하게 났어요. 직원 응대도 불친절했고, 예약한 차량이 아닌 다른 차량을 줬습니다. 가격도 생각보다 비쌌고, 주차장 위치도 찾기 어려웠어요. 다시는 이용 안 할 것 같습니다.",
            3: "직원분은 친절했고 차량 상태도 괜찮았어요. 다만 가격이 조금 비싼 편이었고, 반납 장소가 멀어서 불편했습니다. 차량 내부는 깨끗했는데 외부에 약간 흠집이 있었네요. 전체적으로는 만족하지만 개선이 필요한 부분도 있어요."
        };

        function setExample(num) {
            document.getElementById('reviewInput').value = EXAMPLES[num];
        }

        function clearAll() {
            document.getElementById('reviewInput').value = '';
            document.getElementById('results').classList.remove('show');
        }

        async function analyzeReview() {
            const reviewText = document.getElementById('reviewInput').value.trim();
            if (!reviewText) {
                showToast('리뷰 텍스트를 입력해주세요.', 'warning');
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            btn.disabled = true;
            btn.textContent = '분석 중...';
            loading.classList.add('show');
            results.classList.remove('show');

            try {
                const response = await fetch(`${API_PREFIX}/tags/analyze-tags`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review: reviewText })
                });

                if (!response.ok) {
                    let detail = `서버 오류 (${response.status})`;
                    try {
                        const errJson = await response.json();
                        if (errJson.detail) detail = errJson.detail;
                    } catch (_) { /* ignore non-JSON error body */ }
                    showToast('분석 오류: ' + detail, 'error');
                    return;
                }

                const result = await response.json();
                const data = result.data;

                if (!data) {
                    showToast('서버 응답 형식이 올바르지 않습니다.', 'error');
                    return;
                }

                renderResults(data);
                results.classList.add('show');

            } catch (error) {
                showToast('분석 중 오류가 발생했습니다: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '분석하기';
                loading.classList.remove('show');
            }
        }

        function renderResults(data) {
            // Keywords
            const keywordsList = document.getElementById('keywordsList');
            keywordsList.textContent = '';
            (data.keywords || []).forEach(kw => {
                const div = document.createElement('div');
                div.className = 'keyword';

                const dot = document.createElement('span');
                dot.className = 'keyword-sentiment ' + escapeAttr(kw.sentiment);

                const text = document.createTextNode(escapeHtml(kw.keyword));

                div.appendChild(dot);
                div.appendChild(text);
                keywordsList.appendChild(div);
            });

            // Tag Groups
            const tagGroupsEl = document.getElementById('tagGroups');
            tagGroupsEl.textContent = '';

            let hasGroup = false;
            for (const [tagName, tagData] of Object.entries(data.tag_groups || {})) {
                const positiveKws = tagData.positive || [];
                const negativeKws = tagData.negative || [];
                const neutralKws = tagData.neutral || [];
                const total = positiveKws.length + negativeKws.length + neutralKws.length;
                if (total === 0) continue;
                hasGroup = true;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'tag-group';

                // Header
                const header = document.createElement('div');
                header.className = 'tag-group-header';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'tag-group-name';
                nameSpan.textContent = tagName;

                const badgesDiv = document.createElement('div');
                if (positiveKws.length > 0) {
                    const b = document.createElement('span');
                    b.className = 'tag-group-sentiment positive';
                    b.textContent = '긍정 ' + positiveKws.length + '개';
                    badgesDiv.appendChild(b);
                }
                if (negativeKws.length > 0) {
                    const b = document.createElement('span');
                    b.className = 'tag-group-sentiment negative';
                    b.style.marginLeft = '6px';
                    b.textContent = '부정 ' + negativeKws.length + '개';
                    badgesDiv.appendChild(b);
                }
                if (neutralKws.length > 0) {
                    const b = document.createElement('span');
                    b.className = 'tag-group-sentiment neutral';
                    b.style.marginLeft = '6px';
                    b.textContent = '중립 ' + neutralKws.length + '개';
                    badgesDiv.appendChild(b);
                }

                header.appendChild(nameSpan);
                header.appendChild(badgesDiv);

                // Keywords row
                const kwRow = document.createElement('div');
                kwRow.className = 'tag-group-keywords';

                const appendKw = (list, borderColor) => {
                    list.forEach(k => {
                        const span = document.createElement('span');
                        span.className = 'tag-group-keyword';
                        span.style.borderLeft = '3px solid ' + borderColor;
                        span.textContent = k;
                        kwRow.appendChild(span);
                    });
                };
                appendKw(positiveKws, 'var(--success)');
                appendKw(negativeKws, 'var(--error)');
                appendKw(neutralKws, 'var(--grey-5)');

                groupDiv.appendChild(header);
                groupDiv.appendChild(kwRow);
                tagGroupsEl.appendChild(groupDiv);
            }

            if (!hasGroup) {
                const p = document.createElement('p');
                p.style.color = 'var(--grey-5)';
                p.textContent = '분류된 태그가 없습니다.';
                tagGroupsEl.appendChild(p);
            }

            // Summary Stats
            const stats = document.getElementById('summaryStats');
            const totalKw = (data.keywords || []).length;
            const positiveKw = (data.keywords || []).filter(k => k.sentiment === 'positive').length;
            const negativeKw = (data.keywords || []).filter(k => k.sentiment === 'negative').length;
            const neutralKw = (data.keywords || []).filter(k => k.sentiment === 'neutral').length;
            const sentimentKw = positiveKw + negativeKw;
            const ratio = sentimentKw > 0 ? Math.round((positiveKw / sentimentKw) * 100) : 0;

            const majorTags = Object.keys(data.tag_groups || {}).filter(t => {
                const d = data.tag_groups[t];
                return (d.positive?.length || 0) + (d.negative?.length || 0) + (d.neutral?.length || 0) > 0;
            }).join(', ') || '없음';

            stats.textContent = [
                '총 키워드: ' + totalKw + '개',
                '긍정 키워드: ' + positiveKw + '개',
                '부정 키워드: ' + negativeKw + '개',
                '중립 키워드: ' + neutralKw + '개',
                '긍정 비율 (감성 키워드 중): ' + ratio + '%',
                '',
                '주요 태그: ' + majorTags,
            ].join('\n');
        }
    </script>
</body>

</html>
