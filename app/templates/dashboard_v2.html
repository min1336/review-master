<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Summary AI - 운영팀 대시보드 v2</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Flatpickr Date Range Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ base_path }}/static/css/shared-theme.css">

    <!-- Dashboard CSS (Inlined) -->
    <style>
        :root {
            /* Dashboard-specific overrides — 대시보드는 shared-theme 대비 더 촘촘한 간격/그림자 사용 */
            --blue-grey-light: #f1f4f9;
            --max-width: 1200px;
            --radius-lg: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --spacing-sm: 6px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
        }

        html {
            overflow-y: scroll;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
        }

        /* Header */
        .header {
            background: var(--primary);
            border-bottom: none;
            padding: 32px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(13, 111, 252, 0.15);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Layout */
        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 16px;
        }

        .inner {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .grid {
            display: grid;
            gap: 12px;
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        @media (max-width: 1200px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {

            .grid-4,
            .grid-3,
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 16px;
            border: 1px solid var(--grey-7);
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--grey-8);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--grey-2);
        }

        /* Stat Cards - Compact */
        .stat-card {
            background: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            padding: 10px 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            border: 1px solid var(--grey-8);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-card:hover {
            box-shadow: var(--shadow);
            border-color: var(--card-color, #0d6ffc);
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--card-color, #0d6ffc);
        }

        .stat-icon svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .stat-content {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: var(--grey-5);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--grey-2);
        }

        .stat-change {
            font-size: 13px;
            margin-top: 8px;
        }

        .stat-change.positive {
            color: var(--success);
        }

        .stat-change.negative {
            color: var(--error);
        }

        /* Buttons — 대시보드용 크기 오버라이드 (색상은 shared-theme.css 상속) */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            height: 40px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(13, 111, 252, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: white;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline:hover {
            background: #e8f0fe;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            height: 32px;
        }

        /* AI Summary Button */
        .btn-ai-summary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(13, 111, 252, 0.3);
            white-space: nowrap;
        }

        .btn-ai-summary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 111, 252, 0.4);
        }

        .btn-ai-summary:active {
            transform: translateY(0);
        }

        .btn-ai-summary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* AI Report Button */
        .btn-ai-report {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }

        .btn-ai-report:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-ai-report:active {
            transform: translateY(0);
        }

        .btn-ai-report:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Report Modal Styles */
        .report-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .report-modal {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .report-modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--grey-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .report-modal-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .report-modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .report-modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header-icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .header-icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .report-modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: calc(90vh - 140px);
        }

        /* Period Selection */
        .period-selection {
            margin-bottom: 24px;
        }

        .period-selection label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--grey-2);
        }

        .period-presets {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .period-preset-btn {
            padding: 8px 16px;
            border: 2px solid var(--grey-7);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .period-preset-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }

        .period-preset-btn.active {
            border-color: #10b981;
            background: #10b981;
            color: white;
        }

        .date-range-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .date-range-inputs input {
            padding: 10px 14px;
            border: 1px solid var(--grey-7);
            border-radius: 8px;
            font-size: 14px;
            width: 150px;
        }

        .date-range-inputs input:focus {
            outline: none;
            border-color: #10b981;
        }

        /* Report Content */
        .report-section {
            margin-bottom: 24px;
            padding: 20px;
            background: var(--grey-9);
            border-radius: 12px;
        }

        .report-section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--grey-2);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .report-stat-card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .report-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #10b981;
        }

        .report-stat-label {
            font-size: 12px;
            color: var(--grey-5);
            margin-top: 4px;
        }

        .report-summary-box {
            background: white;
            padding: 16px;
            border-radius: 10px;
            border-left: 4px solid #10b981;
            line-height: 1.7;
            font-size: 14px;
        }

        .report-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .report-keyword {
            background: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Trend Chart */
        .trend-bars {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trend-bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .trend-bar-label {
            width: 60px;
            font-size: 12px;
            color: var(--grey-5);
        }

        .trend-bar-container {
            flex: 1;
            height: 24px;
            background: var(--grey-8);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .trend-bar-positive {
            background: #10b981;
        }

        .trend-bar-neutral {
            background: #fbbf24;
        }

        .trend-bar-negative {
            background: #ef4444;
        }

        .trend-bar-count {
            width: 50px;
            text-align: right;
            font-size: 12px;
            color: var(--grey-5);
        }

        /* Vehicle Table */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .report-table th {
            background: var(--grey-8);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
        }

        .report-table td {
            padding: 12px;
            border-bottom: 1px solid var(--grey-8);
        }

        .report-table tr:last-child td {
            border-bottom: none;
        }

        /* Strengths & Weaknesses */
        .sw-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .sw-column-title {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .sw-column-title.strengths {
            background: #d1fae5;
            color: #065f46;
        }

        .sw-column-title.weaknesses {
            background: #fee2e2;
            color: #991b1b;
        }

        .sw-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sw-tag {
            font-weight: 500;
        }

        .sw-ratio {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .sw-ratio.positive {
            background: #d1fae5;
            color: #065f46;
        }

        .sw-ratio.negative {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Action Items */
        .action-item {
            background: white;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .action-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .action-number {
            width: 24px;
            height: 24px;
            background: #10b981;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
        }

        .action-priority {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .action-priority.high {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-priority.medium {
            background: #fef3c7;
            color: #92400e;
        }

        .action-priority.low {
            background: #dbeafe;
            color: #1e40af;
        }

        .action-category {
            font-weight: 600;
            color: var(--grey-2);
        }

        .action-issue {
            font-size: 13px;
            color: var(--grey-5);
            margin-bottom: 8px;
        }

        .action-solution {
            font-size: 13px;
            background: var(--grey-9);
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 3px solid #10b981;
        }

        /* Loading State */
        .report-loading {
            text-align: center;
            padding: 60px 20px;
        }

        .report-loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--grey-8);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        .report-loading-text {
            color: var(--grey-5);
            font-size: 14px;
        }

        .report-progress-wrap {
            width: 100%;
            max-width: 320px;
            margin: 20px auto 0;
        }

        .report-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--grey-8);
            border-radius: 3px;
            overflow: hidden;
        }

        .report-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #059669);
            border-radius: 3px;
            transition: width 2s ease-out;
        }

        .report-progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 12px;
            color: var(--grey-5);
        }

        .report-progress-percent {
            font-weight: 600;
            color: #10b981;
        }

        /* Generate Button */
        .btn-generate-report {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-generate-report:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-generate-report:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Report Settings Panel */
        .settings-toggle {
            width: 100%;
            margin-top: 16px;
            margin-bottom: 16px;
            padding: 10px 16px;
            background: var(--grey-9, #f9fafb);
            border: 1px solid var(--grey-7, #e5e7eb);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--grey-3, #374151);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .settings-toggle:hover {
            background: var(--grey-8, #f3f4f6);
            border-color: var(--grey-6, #d1d5db);
        }

        .settings-toggle .toggle-arrow {
            transition: transform 0.2s;
            font-size: 12px;
        }

        .settings-toggle.open .toggle-arrow {
            transform: rotate(180deg);
        }

        .settings-panel {
            display: none;
            margin-top: 12px;
        }

        .settings-panel.open {
            display: block;
            margin-bottom: 16px;
        }

        .settings-section {
            border: 1px solid var(--grey-6, #d1d5db);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background: var(--grey-9, #f9fafb);
        }

        .settings-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--grey-2, #1f2937);
            margin-bottom: 12px;
        }

        .settings-checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 13px;
            color: var(--grey-2, #1f2937);
            cursor: pointer;
        }

        .settings-checkbox-row input[type="checkbox"] {
            accent-color: var(--primary, #6366f1);
        }

        .settings-slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--grey-2, #1f2937);
        }

        .settings-slider-row input[type="range"] {
            flex: 1;
            accent-color: var(--primary, #6366f1);
        }

        .settings-slider-row .slider-value {
            min-width: 40px;
            text-align: right;
            font-weight: 600;
            color: var(--grey-2, #1f2937);
        }

        .settings-select-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--grey-2, #1f2937);
        }

        .settings-select-row select {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--grey-7, #e5e7eb);
            border-radius: var(--radius-sm, 6px);
            font-size: 13px;
            font-family: inherit;
            background: white;
        }

        .settings-textarea-row {
            margin-top: 8px;
        }

        .settings-textarea-row textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--grey-7, #e5e7eb);
            border-radius: var(--radius-sm, 6px);
            font-size: 13px;
            resize: vertical;
            font-family: inherit;
            min-height: 60px;
            box-sizing: border-box;
        }

        .char-count {
            text-align: right;
            font-size: 11px;
            color: var(--grey-5, #6b7280);
            margin-top: 4px;
        }

        /* Preset Section */
        .preset-section {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: var(--grey-9, #f9fafb);
            border-radius: var(--radius-sm, 6px);
            border: 1px solid var(--grey-7, #e5e7eb);
        }

        .preset-section select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--grey-7, #e5e7eb);
            border-radius: var(--radius-sm, 6px);
            font-size: 13px;
            background: #fff;
            margin-top: 6px;
        }

        .preset-recommended-badge {
            display: inline-block;
            font-size: 10px;
            background: var(--primary, #6366f1);
            color: #fff;
            padding: 1px 6px;
            border-radius: 9px;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* Focus Areas */
        .settings-focus-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
        }

        .settings-focus-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--grey-3, #374151);
            cursor: pointer;
        }

        .settings-focus-item input[type="checkbox"] {
            accent-color: var(--primary, #6366f1);
        }

        /* Review Count Info */
        .period-count-badge {
            font-size: 11px;
            font-weight: 400;
            color: var(--grey-5);
            margin-left: 2px;
        }

        .period-preset-btn.has-count.sufficient {
            border-color: #a7f3d0;
        }

        .period-preset-btn.has-count.sufficient .period-count-badge {
            color: #10b981;
            font-weight: 600;
        }

        .review-count-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            margin: 0 0 12px 0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .review-count-info.loading {
            background: var(--grey-8);
            color: var(--grey-5);
        }

        .review-count-info.sufficient {
            background: #d1fae5;
            color: #065f46;
        }

        .review-count-info.insufficient {
            background: #fef3c7;
            color: #92400e;
        }

        .review-count-info .count-number {
            font-weight: 700;
        }

        /* PDF Download Button */
        .btn-download-pdf {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-download-pdf:hover {
            background: #1d4ed8;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            min-height: 70vh;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
            table-layout: fixed;
        }

        th {
            background: var(--grey-9);
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: var(--grey-3);
            border-bottom: 1px solid var(--grey-7);
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }

        td {
            padding: 10px 10px;
            text-align: left;
            border-bottom: 1px solid var(--grey-8);
            color: var(--grey-1);
            vertical-align: middle;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: var(--blue-grey-light);
        }

        /* Badges — 대시보드용 크기/border 오버라이드 (shared-theme.css 기본값과 다름) */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
        }

        .badge-grey {
            background: #f3f4f6;
            color: var(--grey-3);
            border: 1px solid #e5e7eb;
        }

        .badge-success {
            background: var(--success-light);
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .badge-warning {
            background: var(--warning-light);
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        /* Rating */
        .rating {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .rating-star {
            color: #fbbf24;
        }

        /* Region Chart */
        .region-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .region-name {
            width: 60px;
            font-size: 13px;
            font-weight: 500;
        }

        .region-bar-container {
            flex: 1;
            height: 24px;
            background: var(--grey-8);
            border-radius: 4px;
            overflow: hidden;
        }

        .region-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .region-count {
            width: 50px;
            text-align: right;
            font-size: 13px;
            color: var(--grey-5);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
            flex-wrap: wrap;
            align-items: center;
            padding: 10px 14px;
            background: var(--grey-9);
            border-radius: var(--radius) var(--radius) 0 0;
            border-bottom: 1px solid var(--grey-7);
            width: 100%;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .filter-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--grey-4);
            white-space: nowrap;
        }

        .filter-select,
        .search-box input {
            padding: 8px 14px;
            border: 1px solid var(--grey-6);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--grey-1);
            background: white;
            min-width: 120px;
            height: 36px;
            outline: none;
            transition: all 0.15s ease;
        }

        .filter-select:hover,
        .search-box input:hover {
            border-color: var(--grey-5);
        }

        .filter-select:focus,
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .search-box input {
            padding-left: 34px;
            padding-right: 30px;
            width: 100%;
        }

        .search-box svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--grey-5);
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: none;
            background: var(--grey-7);
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: var(--grey-4);
            font-size: 12px;
            line-height: 1;
            transition: background 0.15s;
        }

        .search-clear:hover {
            background: var(--grey-6);
            color: var(--grey-2);
        }

        .search-box.has-value .search-clear {
            display: flex;
        }

        /* Date Range Picker */
        .date-range-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .date-range-input {
            padding: 8px 12px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--grey-1);
            background: white;
            flex: 1;
            min-width: 120px;
            height: 36px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .date-range-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .date-range-input::placeholder {
            color: var(--grey-5);
        }

        .btn-clear-date {
            padding: 6px 12px;
            background: var(--grey-8);
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--grey-3);
            cursor: pointer;
            height: 36px;
            transition: all 0.2s;
        }

        .btn-clear-date:hover {
            background: var(--grey-7);
        }

        /* Sort Icons */
        .sort-icon::after {
            content: '↕';
            font-size: 12px;
            margin-left: 4px;
            color: var(--grey-5);
            opacity: 0.5;
        }

        .sort-asc::after {
            content: '↑';
            color: var(--primary);
            opacity: 1;
        }

        .sort-desc::after {
            content: '↓';
            color: var(--primary);
            opacity: 1;
        }

        /* Custom Checkbox */
        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
            height: 40px;
            margin-top: 2px;
        }

        .custom-checkbox:hover {
            background: var(--grey-9);
        }

        .custom-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .custom-checkbox span {
            font-size: 14px;
            font-weight: 500;
            color: var(--grey-2);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--grey-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--grey-1);
        }

        .modal-body {
            padding: 24px;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: #2D3748;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            line-height: 1.4;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--grey-5);
        }

        /* Summary Preview */
        .summary-section {
            margin-bottom: 20px;
        }

        .summary-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--grey-5);
            margin-bottom: 8px;
        }

        .summary-text {
            background: var(--grey-9);
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }

        .summary-empty {
            color: var(--grey-5);
            font-style: italic;
        }

        /* Summary Tooltip (마우스 따라다니는 요약 툴팁) */
        .summary-tooltip {
            position: fixed;
            max-width: 400px;
            padding: 12px 16px;
            background: rgba(30, 30, 30, 0.95);
            color: white;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.6;
            box-shadow: var(--shadow-lg);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: pre-wrap;
            word-break: keep-all;
        }

        .summary-tooltip.visible {
            opacity: 1;
        }

        .summary-tooltip::before {
            content: '📝 요약';
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* Keywords */
        .keywords {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .keyword {
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* 업체/지점 구분 스타일 */
        .branch-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .branch-info .company-name {
            font-weight: 600;
        }

        .branch-info .branch-name {
            font-size: 12px;
            color: var(--grey-4);
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--grey-5);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--grey-7);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        /* Skeleton Loading */
        .skeleton {
            background: #e8e8e8;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skeleton::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .skeleton-row td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--grey-8);
        }

        .skeleton-line {
            height: 14px;
            background: #e8e8e8;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.short {
            width: 40px;
            margin: 0 auto;
        }

        .skeleton-line.medium {
            width: 80%;
        }

        .skeleton-line.long {
            width: 90%;
        }

        .skeleton-stat {
            height: 24px;
            width: 60px;
            background: #e8e8e8;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-stat::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shimmer 1.5s infinite;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--grey-3);
            transition: all 0.2s;
        }

        .tab:hover {
            background: var(--grey-8);
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        /* Review Link */
        .review-link {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            transition: text-decoration 0.2s ease, color 0.2s ease;
        }

        .review-link:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        .review-link:visited {
            color: #7c3aed;
        }

        /* Review Item */
        .review-item {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--grey-8);
        }

        .review-item:nth-child(even) {
            background: var(--grey-9);
        }

        .review-item__header {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
        }

        .review-item__meta {
            font-size: 12px;
            color: var(--grey-5);
        }

        .review-item__content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--grey-2);
        }

        .review-item__footer {
            margin-top: var(--spacing-sm);
            font-size: 12px;
            color: var(--grey-5);
        }

        .review-item__sentiment {
            margin-left: var(--spacing-xs);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>Review Summary AI - 운영팀 대시보드</h1>
        <div class="header-actions">
            <button class="btn btn-header-nav" id="btn-review-detail">카모아 예시</button>
            <button class="btn btn-header-nav" id="btn-scheduler">스케줄러</button>
            <button class="btn btn-header-nav" id="btn-analysis">리뷰 관리</button>
        </div>
    </header>

    <div class="container">
        <!-- Stats Overview - Compact -->
        <div style="display: flex; gap: 12px; flex-wrap: wrap;" id="stats-grid">
            <div class="stat-card" style="--card-color: #0d6ffc;">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-label">총 지점</div>
                    <div class="stat-value" id="stat-total">-</div>
                </div>
            </div>
            <div class="stat-card" style="--card-color: #f093fb; --card-color-end: #f5576c;">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-label">총 리뷰</div>
                    <div class="stat-value" id="stat-reviews">-</div>
                </div>
            </div>
        </div>

        <!-- Branch Summaries Table -->
        <div class="card" style="margin-top: 24px; padding: 0; overflow: hidden;">
            <div class="filters">
                <!-- 지역 필터 -->
                <div class="filter-group">
                    <span class="filter-label">지역</span>
                    <select class="filter-select" id="filter-region">
                        <option value="">전체</option>
                    </select>
                </div>

                <!-- 검색 필터 (ID/업체명/지점) -->
                <div class="filter-group">
                    <span class="filter-label">검색</span>
                    <div class="search-box" id="search-box">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="6" cy="6" r="4.5" />
                            <path d="M10 10l3 3" />
                        </svg>
                        <input type="text" id="search-input" placeholder="ID/업체명/지점...">
                        <button type="button" class="search-clear" id="search-clear" title="검색어 지우기">&times;</button>
                    </div>
                </div>

                <!-- 기간 필터 -->
                <div class="filter-group date-range-filter">
                    <span class="filter-label">기간</span>
                    <input type="text" id="filter-date-range" class="date-range-input" placeholder="날짜 범위 선택..."
                        readonly>
                    <button class="btn-clear-date" id="btn-clear-date"
                        onclick="window.dashboardHandlers.clearDateFilter()" style="display: none;">초기화</button>
                </div>
            </div>

            <!-- Batch Actions -->
            <div id="batch-actions"
                style="display: none; align-items: center; justify-content: space-between; padding: 10px 16px; background: #eef2ff; border-radius: var(--radius-md); margin-bottom: 8px;">
                <span style="font-size: 13px; color: var(--grey-2);"><strong id="selected-count">0</strong>개 업체
                    선택됨</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary btn-sm"
                        onclick="window.dashboardHandlers.clearBranchSelection()">선택 취소</button>
                    <button id="btn-batch-pdf" class="btn btn-primary btn-sm"
                        onclick="window.dashboardHandlers.downloadBatchPDF()">일괄 리포트 생성</button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <colgroup>
                        <col style="width: 36px;"> <!-- Checkbox -->
                        <col style="width: 50px;"> <!-- Region -->
                        <col style="width: 160px;"> <!-- Name -->
                        <col style="width: 130px;"> <!-- Summary -->
                        <col style="width: 60px;"> <!-- Rating -->
                        <col style="width: 60px;"> <!-- Review Count -->
                    </colgroup>
                    <thead>
                        <tr>
                            <th style="width: 36px; text-align: center; padding: 8px 4px;">
                                <input type="checkbox" id="select-all-branch" title="전체 선택"
                                    style="cursor: pointer; accent-color: var(--primary);">
                            </th>
                            <th onclick="handleSort('region')" onkeydown="if(event.key==='Enter')handleSort('region')" tabindex="0" role="button" style="cursor: pointer;">지역 <span id="sort-icon-region"
                                    class="sort-icon"></span></th>
                            <th onclick="handleSort('branch_name')" onkeydown="if(event.key==='Enter')handleSort('branch_name')" tabindex="0" role="button" style="cursor: pointer;">업체명 <span
                                    id="sort-icon-branch_name" class="sort-icon"></span></th>
                            <th>요약</th>
                            <th onclick="handleSort('avg_rating')" onkeydown="if(event.key==='Enter')handleSort('avg_rating')" tabindex="0" role="button"
                                style="cursor: pointer; width: 70px; text-align: center;">별점 <span
                                    id="sort-icon-avg_rating" class="sort-icon"></span></th>
                            <th onclick="handleSort('review_count')" onkeydown="if(event.key==='Enter')handleSort('review_count')" tabindex="0" role="button"
                                style="cursor: pointer; width: 80px; text-align: center;">리뷰수 <span
                                    id="sort-icon-review_count" class="sort-icon"></span></th>
                        </tr>
                    </thead>
                    <tbody id="summaries-table">
                        <script>
                            (function () {
                                var tb = document.getElementById('summaries-table');
                                if (!tb) return;
                                var h = '';
                                for (var i = 0; i < 8; i++) {
                                    h += '<tr class="skeleton-row"><td></td><td><div class="skeleton-line short" style="width:36px;height:12px;"></div></td><td><div class="skeleton-line medium" style="height:14px;margin-bottom:6px;"></div><div class="skeleton-line" style="width:50%;height:10px;"></div></td><td><div class="skeleton-line long" style="height:14px;"></div></td><td><div class="skeleton-line short" style="width:44px;height:14px;"></div></td><td><div class="skeleton-line short" style="width:36px;height:14px;"></div></td></tr>';
                                }
                                tb.innerHTML = h;
                            })();
                        </script>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div style="display: flex; justify-content: center; align-items: center; padding: 16px 0;">
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary btn-sm" id="prev-btn" onclick="prevPage()">이전</button>
                    <button class="btn btn-secondary btn-sm" id="next-btn" onclick="nextPage()">다음</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Batch Period Modal -->
    <div class="modal-overlay" id="batch-period-modal">
        <div class="modal" style="max-width: 440px;">
            <div class="modal-header">
                <h3>리포트 기간 선택</h3>
                <button class="modal-close" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body" style="padding: 24px;">
                <p style="font-size: 13px; color: var(--grey-3); margin-bottom: 16px;">
                    선택한 <strong id="batch-period-count">0</strong>개 업체의 리포트를 생성할 기간을 선택하세요.
                </p>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;">
                    <button class="btn btn-secondary btn-sm batch-period-btn" data-period="1m">1개월</button>
                    <button class="btn btn-secondary btn-sm batch-period-btn" data-period="3m">3개월</button>
                    <button class="btn btn-secondary btn-sm batch-period-btn" data-period="6m">6개월</button>
                    <button class="btn btn-secondary btn-sm batch-period-btn active" data-period="1y" style="outline: 2px solid var(--primary); outline-offset: 1px;">1년</button>
                    <button class="btn btn-secondary btn-sm batch-period-btn" data-period="all">전체</button>
                </div>
                <details style="margin-bottom: 20px;">
                    <summary style="font-size: 13px; color: var(--grey-3); cursor: pointer; margin-bottom: 8px;">직접 입력</summary>
                    <div style="display: flex; gap: 8px; align-items: center; margin-top: 8px;">
                        <input type="date" id="batch-start-date" class="form-control" style="font-size: 13px; padding: 6px 10px;">
                        <span style="color: var(--grey-4);">~</span>
                        <input type="date" id="batch-end-date" class="form-control" style="font-size: 13px; padding: 6px 10px;">
                    </div>
                </details>
                <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; border-top: 1px solid var(--grey-8);">
                    <button class="btn btn-secondary btn-sm" id="batch-cancel-btn">취소</button>
                    <button class="btn btn-primary btn-sm" id="batch-confirm-btn">생성</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">지점 상세</h3>
                <button class="modal-close" onclick="window.dashboardHandlers.closeModal()" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- AI Report Modal -->
    <div class="report-modal-overlay" id="report-modal">
        <div class="report-modal">
            <div class="report-modal-header">
                <h3 id="report-modal-title">📋 AI 리포트</h3>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <button id="header-back-btn" class="header-icon-btn" title="목록으로" style="display: none;">
                        ←
                    </button>
                    <button id="header-regen-btn" class="header-icon-btn"
                        onclick="window.dashboardHandlers.regenerateReport()" title="재생성" style="display: none;">
                        ↻
                    </button>
                    <button id="header-pdf-btn" class="header-icon-btn"
                        onclick="window.dashboardHandlers.downloadReportPDF()" title="PDF 다운로드" style="display: none;">
                        ↓
                    </button>
                    <button class="report-modal-close"
                        onclick="window.dashboardHandlers.closeReportModal()" aria-label="닫기">&times;</button>
                </div>
            </div>
            <div class="report-modal-body" id="report-modal-body">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Flatpickr JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script>window.__BASE_PATH__={{ base_path | tojson }};</script>
    <script>{{ shared_utils_js | safe }}</script>

    <!-- Dashboard Config (Jinja2 → JS) -->
    <script>
        window.__DASHBOARD_CONFIG__ = {
            API_PREFIX: '{{ api_prefix }}',
            CARMORE_ADMIN_URL: '{{ carmore_admin_url }}'
        };
    </script>
    <script src="{{ base_path }}/static/js/dashboard.js"></script>
</body>

</html>
