            async function generateReport() {
                const body = getElement('report-modal-body');
                if (!body) return;

                // 이전 폴링 취소
                if (reportPollingController) {
                    reportPollingController.abort();
                }
                reportPollingController = new AbortController();

                // 로딩 표시
                showReportLoadingUI(body, 'AI가 리포트를 생성 중입니다...');

                try {
                    // 1단계: 비동기 작업 제출 (즉시 반환)
                    const submitResponse = await fetch(`${API_PREFIX}/v2/report/${reportState.branchId}/generate/async`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            start_date: reportState.startDate,
                            end_date: reportState.endDate
                        }),
                        signal: reportPollingController.signal
                    });

                    if (!submitResponse.ok) {
                        const error = await submitResponse.json();
                        throw new Error(error.detail || '리포트 생성 요청 실패');
                    }

                    const submitResult = await submitResponse.json();
                    if (!submitResult.success || !submitResult.job_id) {
                        throw new Error(submitResult.error || '작업 ID를 받지 못했습니다');
                    }

                    const jobId = submitResult.job_id;

                    // 2단계: 폴링으로 진행 상태 확인 (최대 2분)
                    await pollReportJob(jobId, true);

                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log('Report generation aborted');
                        return;
                    }
                    console.error('Report generation error:', error);
                    showReportErrorUI(body, '리포트 생성 실패', error.message, 'renderReportPeriodSelection');
                }
            }

            function showReportLoadingUI(container, message) {
                // 로딩 컨테이너 생성
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'report-loading';

                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                loadingDiv.appendChild(spinner);

                const textDiv = document.createElement('div');
                textDiv.className = 'report-loading-text';
                textDiv.textContent = message;
                loadingDiv.appendChild(textDiv);

                container.replaceChildren(loadingDiv);
            }

            function showReportErrorUI(container, title, message, retryHandler) {
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'text-align: center; padding: 40px;';

                const icon = document.createElement('div');
                icon.style.cssText = 'font-size: 48px; margin-bottom: 16px;';
                icon.textContent = '\u274C';
                errorDiv.appendChild(icon);

                const titleDiv = document.createElement('div');
                titleDiv.style.cssText = 'font-size: 16px; color: var(--grey-2); margin-bottom: 8px;';
                titleDiv.textContent = title;
                errorDiv.appendChild(titleDiv);

                const msgDiv = document.createElement('div');
                msgDiv.style.cssText = 'font-size: 14px; color: var(--grey-5); margin-bottom: 24px;';
                msgDiv.textContent = message;
                errorDiv.appendChild(msgDiv);

                const btn = document.createElement('button');
                btn.className = 'btn btn-secondary';
                btn.textContent = retryHandler === 'renderReportPeriodSelection' ? '다시 시도' : '돌아가기';
                btn.onclick = () => window.dashboardHandlers[retryHandler](retryHandler === 'renderReportContent' ? reportState.reportData : undefined, false);
                errorDiv.appendChild(btn);

                container.replaceChildren(errorDiv);
            }

            async function pollReportJob(jobId, isNew) {
                const maxPolls = 60;
                let pollCount = 0;

                while (pollCount < maxPolls) {
                    // 폴링 취소 확인
                    if (reportPollingController && reportPollingController.signal.aborted) {
                        console.log('Report polling cancelled');
                        return;
                    }

                    const statusResponse = await fetch(`${API_PREFIX}/v2/report/${reportState.branchId}/job/${jobId}`, {
                        signal: reportPollingController ? reportPollingController.signal : undefined
                    });

                    if (!statusResponse.ok) {
                        throw new Error('작업 상태 조회 실패');
                    }

                    const statusResult = await statusResponse.json();
                    const jobData = statusResult.data;

                    if (jobData.status === 'completed') {
                        // 완료 - 리포트 데이터 가져오기
                        const reportData = await fetchReportData();
                        if (reportData) {
                            reportState.reportData = reportData;
                            renderReportContent(reportData, isNew);
                        }
                        return;
                    } else if (jobData.status === 'failed') {
                        throw new Error(jobData.error_message || '리포트 생성 실패');
                    }

                    // 2초 대기 후 다음 폴링
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    pollCount++;
                }

                // 타임아웃
                throw new Error('리포트 생성 시간이 초과되었습니다. 잠시 후 다시 시도해주세요.');
            }

            async function fetchReportData() {
                // 생성된 리포트 데이터 가져오기
                const response = await fetch(
                    `${API_PREFIX}/v2/report/${reportState.branchId}?start_date=${reportState.startDate}&end_date=${reportState.endDate}`,
                    { signal: reportPollingController ? reportPollingController.signal : undefined }
                );

                if (!response.ok) {
                    throw new Error('리포트 데이터 조회 실패');
                }

                const result = await response.json();
                return result.success ? result.data : null;
            }

            async function regenerateReport() {
                const body = getElement('report-modal-body');
                if (!body) return;

                // 이전 폴링 취소
                if (reportPollingController) {
                    reportPollingController.abort();
                }
                reportPollingController = new AbortController();

                // 로딩 표시
                showReportLoadingUI(body, 'AI가 리포트를 재생성 중입니다...');

                try {
                    // 비동기 작업 제출 (/generate/async는 regenerate와 동일한 로직 사용)
                    const submitResponse = await fetch(`${API_PREFIX}/v2/report/${reportState.branchId}/generate/async`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            start_date: reportState.startDate,
                            end_date: reportState.endDate
                        }),
                        signal: reportPollingController.signal
                    });

                    if (!submitResponse.ok) {
                        const error = await submitResponse.json();
                        throw new Error(error.detail || '리포트 재생성 요청 실패');
                    }

                    const submitResult = await submitResponse.json();
                    if (!submitResult.success || !submitResult.job_id) {
                        throw new Error(submitResult.error || '작업 ID를 받지 못했습니다');
                    }

                    const jobId = submitResult.job_id;

                    // 폴링으로 진행 상태 확인
                    await pollReportJob(jobId, true);

                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log('Report regeneration aborted');
                        return;
                    }
                    console.error('Report regeneration error:', error);
                    showReportErrorUI(body, '리포트 재생성 실패', error.message, 'renderReportContent');
                }
            }

            function renderReportContent(data, isNew = true) {
                const body = getElement('report-modal-body');
                if (!body) return;

                // 차량별 분석 테이블
                let vehicleRowsHtml = '';
                if (data.vehicle_analysis && data.vehicle_analysis.length > 0) {
                    data.vehicle_analysis.forEach(v => {
                        vehicleRowsHtml += `
                            <tr>
                                <td>${escapeHtml(v.model || '')}</td>
                                <td style="text-align: center;">${v.count}건</td>
                                <td style="color: #10b981;">${escapeHtml(v.top_praise || '-')}</td>
                                <td style="color: #ef4444;">${escapeHtml(v.top_issue || '-')}</td>
                            </tr>
                        `;
                    });
                } else {
                    vehicleRowsHtml = '<tr><td colspan="4" style="text-align: center; color: var(--grey-5);">차량별 데이터가 없습니다.</td></tr>';
                }

                // 키워드 태그
                const keywordsHtml = (data.top_keywords || []).map(kw => `<span class="report-keyword">${escapeHtml(kw)}</span>`).join('');

                // 헤더 버튼들 표시
                const headerBackBtn = document.getElementById('header-back-btn');
                const headerRegenBtn = document.getElementById('header-regen-btn');
                const headerPdfBtn = document.getElementById('header-pdf-btn');
                if (headerBackBtn) {
                    headerBackBtn.style.display = 'block';
                    headerBackBtn.onclick = () => window.dashboardHandlers.openReportModal(data.branch_id, data.branch_name || '', data.affiliate_name || '');
                }
                if (headerRegenBtn) headerRegenBtn.style.display = 'block';
                if (headerPdfBtn) headerPdfBtn.style.display = 'block';

                body.innerHTML = `
                    <div style="margin-bottom: 16px;">
                        <span style="font-size: 13px; color: var(--grey-5);">분석 기간: ${data.period_start} ~ ${data.period_end}</span>
                    </div>

                    <!-- Period Summary -->
                    <div class="report-section">
                        <div class="report-section-title">📊 기간별 요약 분석</div>
                        <div class="report-summary-box">
                            ${escapeHtml(data.period_summary || '요약 정보가 없습니다.')}
                        </div>
                    </div>


                    <!-- Vehicle Analysis -->
                    <div class="report-section">
                        <div class="report-section-title">🚗 차량별 평가 분석</div>
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>차량 모델</th>
                                    <th style="text-align: center;">리뷰 수</th>
                                    <th>주요 호평</th>
                                    <th>주요 불만</th>
                                </tr>
                            </thead>
                            <tbody>${vehicleRowsHtml}</tbody>
                        </table>
                    </div>

                    <div style="text-align: center; padding: 8px 0; color: var(--grey-5); font-size: 12px; margin-top: 16px; border-top: 1px solid var(--grey-7); padding-top: 16px;">
                        Generated by Carmore AI · ${data.generated_at || new Date().toLocaleString('ko-KR')}
                    </div>
                `;
            }

            function downloadReportPDF() {
                if (!reportState.branchId) {
                    showToast('❌ 리포트 정보가 없습니다.', 'error');
                    return;
                }

                const url = `${API_PREFIX}/v2/report/${reportState.branchId}/pdf?start_date=${reportState.startDate}&end_date=${reportState.endDate}`;
                window.open(url, '_blank');
            }

            async function updateStatus(branchId, status) {
                try {
                    const result = await apiUpdateStatus(branchId, status);

                    if (result.success) {
                        showToast(`✅ 상태가 ${STATUS_LABEL_MAP[status] || status}로 변경되었습니다.`, 'success');
                        closeModal();
                        await loadStats();
                        await loadSummaries();
                    }
                } catch (e) {
                    console.error('Status update error:', e);
                    showToast('❌ 상태 변경 실패: ' + e.message, 'error');
                }
            }

            async function toggleReviews(branchId) {
                const section = getElement('reviews-section');
                const btn = getElement('btn-toggle-reviews');
                const visible = toggleReviewsVisibility();

                if (section) section.style.display = visible ? 'block' : 'none';
                if (btn) btn.textContent = visible ? '📋 리뷰 숨기기' : '📋 리뷰 보기';

                if (visible) {
                    const carSelect = getElement('filter-car-model');
                    const sentSelect = getElement('filter-sentiment');
                    const tagsSection = getElement('car-model-tags');

                    if (carSelect) carSelect.value = '';
                    if (sentSelect) sentSelect.value = '';
                    if (tagsSection) tagsSection.style.display = 'none';

                    // 차량 태그 정보 미리 로드
                    clearCarModelTags();
                    loadCarModelTagsAsync(branchId);

                    await loadReviews(branchId);
                }
            }

            async function loadCarModelTagsAsync(branchId) {
                try {
                    const result = await fetchCarModelTags(branchId);
                    const carModels = result.car_models || [];

                    // 각 차량별 태그 캐싱
                    carModels.forEach(car => {
                        setCarModelTags(car.name, car.tags || []);
                    });

                    console.log('📊 차량별 태그 로드 완료:', carModels.length, '종');
                } catch (e) {
                    console.warn('차량별 태그 로드 실패:', e);
                }
            }

            async function toggleCarList(branchId) {
                const section = getElement('carlist-section');
                const btn = getElement('btn-toggle-carlist');
                const visible = toggleCarListVisibility();

                if (section) section.style.display = visible ? 'block' : 'none';
                if (btn) btn.textContent = visible ? '🚗 차량 숨기기' : '🚗 차량 리스트';

                if (visible && !state.carList.loaded) {
                    await loadCarList(branchId);
                }
            }

            async function loadCarList(branchId) {
                const content = getElement('carlist-content');
                const countEl = getElement('carlist-count');

                if (content) {
                    content.innerHTML = '<div class="loading"><div class="spinner"></div>로딩 중...</div>';
                }

                try {
                    const result = await fetchBranchReviews(branchId, { limit: 1, offset: 0 });
                    const carModels = result.car_models || [];

                    setCarListModels(carModels);

                    if (countEl) {
                        countEl.textContent = `(${carModels.length}종)`;
                    }

                    if (content) {
                        if (carModels.length === 0) {
                            content.innerHTML = '<div style="padding: 16px; color: var(--grey-5); font-style: italic;">등록된 차량이 없습니다.</div>';
                        } else {
                            content.innerHTML = carModels.map(model => `
                                <span style="display: inline-block; padding: 8px 16px; background: var(--grey-8); border-radius: 20px; font-size: 13px; color: var(--grey-2);">
                                    🚗 ${escapeHtml(model)}
                                </span>
                            `).join('');
                        }
                    }
                } catch (e) {
                    console.error('Car list load error:', e);
                    if (content) {
                        content.innerHTML = '<div style="padding: 16px; color: var(--error);">차량 리스트 로드 실패</div>';
                    }
                }
            }

            async function onCarModelChange(branchId) {
                const carSelect = getElement('filter-car-model');
                const tagsSection = getElement('car-model-tags');
                const carNameEl = getElement('selected-car-name');
                const tagsContent = getElement('car-model-tags-content');

                const selectedCar = carSelect?.value || '';

                if (selectedCar) {
                    // 차량 선택됨 - 태그 표시
                    if (carNameEl) carNameEl.textContent = selectedCar;
                    if (tagsSection) tagsSection.style.display = 'block';

                    let tags = getCarModelTags(selectedCar);

                    if (tags.length === 0) {
                        // 캐시에 없으면 API 호출
                        if (tagsContent) tagsContent.innerHTML = '<span style="color: var(--grey-5);">로딩 중...</span>';

                        try {
                            const result = await fetchCarModelTags(branchId);
                            const carModels = result.car_models || [];

                            // 모든 차량 태그 캐싱
                            carModels.forEach(car => {
                                setCarModelTags(car.name, car.tags || []);
                            });

                            tags = getCarModelTags(selectedCar);
                        } catch (e) {
                            console.error('차량 태그 로드 실패:', e);
                        }
                    }

                    renderCarModelTags(tags, tagsContent);
                } else {
                    // 전체 차량 - 태그 숨김
                    if (tagsSection) tagsSection.style.display = 'none';
                }

                // 리뷰 필터 적용
                applyFilters(branchId);
            }

            function renderCarModelTags(tags, container) {
                if (!container) return;

                if (!tags || tags.length === 0) {
                    container.innerHTML = '<span style="color: var(--grey-5); font-style: italic; font-size: 12px;">태그 정보가 없습니다.</span>';
                    return;
                }

                container.innerHTML = tags.map(tag => {
                    const total = tag.total || (tag.positive + tag.negative + (tag.neutral || 0));
                    const posRatio = total > 0 ? Math.round((tag.positive / total) * 100) : 0;
                    const bgColor = posRatio >= 70 ? '#dcfce7' : posRatio <= 30 ? '#fee2e2' : '#fef3c7';
                    const textColor = posRatio >= 70 ? '#166534' : posRatio <= 30 ? '#991b1b' : '#92400e';
                    return `
                        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: ${bgColor}; border-radius: 12px; font-size: 11px; color: ${textColor};">
                            <span style="font-weight: 600;">${escapeHtml(tag.name)}</span>
                            <span style="opacity: 0.8;">👍${tag.positive} 👎${tag.negative}</span>
                        </span>
                    `;
                }).join('');
            }

            function applyFilters(branchId) {
                setReviewsPage(0);
                loadReviews(branchId);
            }

            async function loadReviews(branchId) {
                showReviewsLoading();

                const offset = state.reviews.currentPage * state.reviews.pageSize;

                try {
                    const result = await fetchBranchReviews(branchId, {
                        limit: state.reviews.pageSize,
                        offset,
                        carModel: getElement('filter-car-model')?.value || '',
                        sentiment: getElement('filter-sentiment')?.value || ''
                    });

                    console.log('📋 리뷰 API 응답:', result);

                    setReviewsTotal(result.total || 0);

                    if (!state.reviews.carModelsLoaded && result.car_models?.length > 0) {
                        updateCarModelDropdown(result.car_models);
                        markCarModelsLoaded();
                    }

                    updateReviewsCount(result.total || 0);
                    renderReviewsList(result.reviews || [], offset);

                    const totalPages = Math.ceil((result.total || 0) / state.reviews.pageSize);
                    updateReviewsPagination(state.reviews.currentPage, totalPages);

                } catch (e) {
                    console.error('Reviews load error:', e);
                    getElement('reviews-list').innerHTML = '<div style="padding: 24px; text-align: center; color: var(--error);">로드 실패</div>';
                }
            }

            function loadMoreReviews(branchId, direction) {
                if (direction === 'prev' && state.reviews.currentPage > 0) {
                    setReviewsPage(state.reviews.currentPage - 1);
                } else if (direction === 'next') {
                    setReviewsPage(state.reviews.currentPage + 1);
                }

                loadReviews(branchId);
            }

            async function syncAffiliates() {
                // TODO: 구현 예정
                showToast('업체 동기화 기능은 준비 중입니다.', 'info');
            }

            // Expose global handlers immediately (before DOMContentLoaded)
            registerGlobalHandlers();

            // Auto Initialize
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
