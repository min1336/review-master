<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Summary AI - 운영팀 대시보드 v2</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Flatpickr Date Range Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>Review Summary AI - 운영팀 대시보드</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="window.open('/tag-tester', '_blank')">태그 분석 테스트</button>
            <button class="btn btn-primary" onclick="syncAffiliates()">업체정보 동기화</button>
        </div>
    </header>

    <div class="container">
        <!-- Stats Overview -->
        <div class="grid grid-3" id="stats-grid">
            <div class="stat-card" style="--card-color: #667eea; --card-color-end: #764ba2;">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div class="stat-label">총 지점</div>
                <div class="stat-value" id="stat-total">-</div>
            </div>
            <div class="stat-card" style="--card-color: #f093fb; --card-color-end: #f5576c;">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </div>
                <div class="stat-label">총 리뷰</div>
                <div class="stat-value" id="stat-reviews">-</div>
            </div>
            <div class="stat-card" style="--card-color: #4facfe; --card-color-end: #00f2fe;">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div class="stat-label">게시 완료</div>
                <div class="stat-value" id="stat-published">-</div>
            </div>
        </div>

        <!-- Main Content -->
        <div style="margin-top: 24px; max-width: 400px;">
            <!-- Status Stats -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">상태별 현황</span>
                </div>
                <div id="status-stats">
                    <div class="loading">
                        <div class="spinner"></div>로딩 중...
                    </div>
                </div>
            </div>
        </div>

        <!-- Branch Summaries Table -->
        <div class="card" style="margin-top: 24px;">
            <div class="filters">
                <div class="filter-group">
                    <span class="filter-label">지역</span>
                    <select class="filter-select" id="filter-region">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">상태</span>
                    <select class="filter-select" id="filter-status">
                        <option value="">전체</option>
                        <option value="draft">Draft</option>
                        <option value="approved">Approved</option>
                        <option value="published">Published</option>
                    </select>
                </div>

                <!-- 기간 필터 -->
                <div class="filter-group date-range-filter">
                    <span class="filter-label">기간</span>
                    <input type="text" id="filter-date-range" class="date-range-input" placeholder="날짜 범위 선택..."
                        readonly>
                    <button class="btn-clear-date" id="btn-clear-date" onclick="clearDateFilter()"
                        style="display: none;">초기화</button>
                </div>

                <!-- Search (Right aligned) -->
                <div class="search-box" style="margin-left: auto;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="7" cy="7" r="5" />
                        <path d="M12 12l3 3" />
                    </svg>
                    <input type="text" id="search-input" placeholder="업체명, 키워드 검색...">
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <colgroup>
                        <col style="width: 250px;"> <!-- Name (Wider) -->
                        <col style="width: 35%;"> <!-- Summary -->
                        <col style="width: 120px;"> <!-- Review Count -->
                        <col style="width: 250px;"> <!-- Tags -->
                        <col style="width: 100px;"> <!-- Status -->
                        <col style="width: 80px;"> <!-- Action -->
                    </colgroup>
                    <thead>
                        <tr>
                            <th onclick="handleSort('branch_name')" style="cursor: pointer;">업체명 <span
                                    id="sort-icon-branch_name" class="sort-icon"></span></th>
                            <th style="min-width: 200px;">요약</th>
                            <th onclick="handleSort('review_count')" style="cursor: pointer;">리뷰수 <span
                                    id="sort-icon-review_count" class="sort-icon"></span></th>
                            <th>태그</th>
                            <th>상태</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody id="summaries-table">
                        <tr>
                            <td colspan="7" class="loading">
                                <div class="spinner"></div>로딩 중...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                <span id="pagination-info" style="font-size: 13px; color: var(--grey-5);">-</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary btn-sm" id="prev-btn" onclick="prevPage()">이전</button>
                    <button class="btn btn-secondary btn-sm" id="next-btn" onclick="nextPage()">다음</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">지점 상세</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Flatpickr JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

    <!-- Dashboard JavaScript (ES6 Module) -->
    <script type="module" src="/static/js/dashboard.js"></script>
</body>

</html>
