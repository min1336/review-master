<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 분석 - Review Summary AI</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ base_path }}/static/css/shared-theme.css">

    <style>
        :root {
            --max-width: 1400px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Header */
        .header {
            background: var(--primary);
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(13, 111, 252, 0.15);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Container */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        /* Filter Section - Compact */
        .filter-card {
            background: white;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            padding: 12px 16px;
            margin-bottom: var(--spacing-md);
            border: 1px solid var(--grey-7);
        }

        .filter-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--grey-3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-title .cascade-hint {
            font-size: 11px;
            font-weight: 400;
            color: var(--grey-5);
            background: var(--grey-8);
            padding: 1px 6px;
            border-radius: 4px;
        }

        /* Cascading Filter Row - Compact */
        .filter-cascade {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .filter-cascade .filter-step {
            flex: 1;
            min-width: 0;
        }

        .filter-cascade .arrow {
            display: flex;
            align-items: center;
            padding-top: 20px;
            color: var(--grey-6);
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .filter-cascade {
                flex-direction: column;
            }

            .filter-cascade .arrow {
                display: none;
            }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--grey-4);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-label .step-number {
            background: var(--primary);
            color: white;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
        }

        .filter-label .count-badge {
            background: var(--grey-8);
            color: var(--grey-5);
            padding: 0px 5px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 400;
        }

        /* Dropdown Select - Compact */
        .filter-select-wrapper {
            position: relative;
        }

        .filter-select {
            width: 100%;
            padding: 6px 10px;
            padding-right: 28px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s;
            appearance: none;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-select:disabled {
            background: var(--grey-8);
            color: var(--grey-5);
            cursor: not-allowed;
        }

        .filter-select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8px;
            color: var(--grey-5);
            pointer-events: none;
        }

        .filter-input {
            padding: 6px 10px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: white;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Selected Chips - Compact */
        .selected-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
            min-height: 28px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .chip .remove {
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            opacity: 0.7;
        }

        .chip .remove:hover {
            opacity: 1;
        }

        /* Additional Filters - Compact */
        .filter-row {
            display: flex;
            gap: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--grey-8);
            align-items: flex-end;
        }

        @media (max-width: 768px) {
            .filter-row {
                flex-wrap: wrap;
            }
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* Buttons - Compact */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: white;
            color: var(--grey-3);
            border: 1px solid var(--grey-7);
        }

        .btn-secondary:hover {
            background: var(--grey-9);
        }

        /* Review List */
        .review-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--grey-7);
        }

        .review-header {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--grey-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .review-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--grey-2);
        }

        .review-count {
            font-size: 14px;
            color: var(--grey-5);
        }

        /* Collapsible */
        .collapsible {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .collapsible.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .toggle-icon {
            display: inline-block;
            vertical-align: middle;
        }

        .toggle-icon.rotated {
            transform: rotate(-180deg);
        }

        .review-header-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .btn-export {
            background: #217346;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
        }

        .btn-export:hover:not(:disabled) {
            background: #1a5c38;
        }

        .btn-export:disabled {
            background: var(--grey-7);
            color: var(--grey-5);
            cursor: not-allowed;
        }

        .review-list {
            /* 검색 결과 섹션은 페이지네이션으로 탐색 */
        }

        /* 신규 리뷰 섹션 스크롤 */
        #newReviewList {
            max-height: 450px;
            overflow-y: auto;
        }

        /* 스크롤바 스타일링 */
        #newReviewList::-webkit-scrollbar {
            width: 8px;
        }

        #newReviewList::-webkit-scrollbar-track {
            background: var(--grey-8);
            border-radius: 4px;
        }

        #newReviewList::-webkit-scrollbar-thumb {
            background: var(--grey-5);
            border-radius: 4px;
        }

        #newReviewList::-webkit-scrollbar-thumb:hover {
            background: var(--grey-3);
        }

        .review-item {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--grey-8);
            transition: background 0.2s;
        }

        .review-item:hover {
            background: var(--grey-9);
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .review-info {
            display: flex;
            gap: var(--spacing-md);
            font-size: 13px;
            color: var(--grey-5);
        }

        .review-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-id {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
        }

        .info-id:hover {
            text-decoration: underline;
        }

        .review-ratings {
            display: flex;
            gap: var(--spacing-sm);
        }

        .rating-item {
            font-size: 12px;
            padding: 2px 8px;
            background: var(--grey-8);
            border-radius: 4px;
            color: var(--grey-3);
        }

        .review-sentiment {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .review-sentiment.positive {
            background: var(--success-light);
            color: #065f46;
        }

        .review-sentiment.negative {
            background: var(--error-light);
            color: #991b1b;
        }

        .review-sentiment.neutral {
            background: var(--grey-8);
            color: var(--grey-3);
        }

        .review-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--grey-2);
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--grey-7);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinning {
            animation: spin 1s linear infinite;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--grey-5);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            stroke: var(--grey-7);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            border-top: 1px solid var(--grey-8);
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius-sm);
            background: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--grey-9);
            border-color: var(--grey-5);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-info {
            font-size: 14px;
            color: var(--grey-5);
            padding: 0 var(--spacing-md);
        }

        /* Sort Section */
        .sort-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .sort-label {
            font-size: 13px;
            color: var(--grey-5);
        }

        .sort-buttons {
            display: flex;
            gap: 4px;
            background: var(--grey-8);
            padding: 4px;
            border-radius: var(--radius-sm);
        }

        .sort-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            background: transparent;
            font-size: 13px;
            color: var(--grey-3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn:hover {
            background: white;
        }

        .sort-btn.active {
            background: white;
            color: var(--primary);
            font-weight: 500;
            box-shadow: var(--shadow-sm);
        }

        /* 신규 배지 */
        .new-badge {
            background: var(--error);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
        }

        .review-item.is-new {
            border-left: 3px solid var(--primary);
            background: var(--primary-light);
        }

        .review-item .new-tag {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* 신규 리뷰 다중 선택 */
        .new-review-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .new-review-actions .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .new-review-actions .btn-sm:hover:not(:disabled) {
            background: var(--bg-secondary);
        }

        .new-review-actions .btn-sm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .new-review-actions .btn-sm.btn-primary-sm {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .new-review-actions .btn-sm.btn-primary-sm:hover:not(:disabled) {
            background: var(--primary);
            opacity: 0.85;
        }

        .review-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .review-item.has-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .review-item.has-checkbox .review-content-wrap {
            flex: 1;
            min-width: 0;
        }

        /* 스케줄러 상태 UI */
        .manual-sync-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }

        .manual-sync-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .manual-sync-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .manual-sync-btn svg {
            transition: transform 0.3s;
        }

        .manual-sync-btn.syncing svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* 동기화 프로그레스 오버레이 */
        .sync-progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .sync-progress-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            min-width: 360px;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .sync-progress-card h3 {
            margin: 0 0 20px 0;
            font-size: 18px;
            color: #1a202c;
        }

        .sync-progress-bar-wrap {
            background: #e2e8f0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .sync-progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 8px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .sync-progress-text {
            font-size: 14px;
            color: #718096;
            margin-bottom: 16px;
        }

        .sync-progress-cancel-btn {
            padding: 8px 20px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            color: #718096;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sync-progress-cancel-btn:hover {
            background: #f7fafc;
            color: #e53e3e;
            border-color: #e53e3e;
        }

        .scheduler-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .scheduler-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .scheduler-indicator.active {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .scheduler-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .scheduler-label {
            font-weight: 500;
        }

        .scheduler-next {
            font-size: 10px;
            opacity: 0.8;
        }

        .scheduler-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }

        .scheduler-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .scheduler-toggle:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scheduler-interval {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }

        .scheduler-interval option {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>리뷰 분석</h1>
        <div class="header-actions">
            <!-- 스케줄러 상태 -->
            <!-- 스케줄러 상태 (일일 동기화 + 신규 리뷰) -->
            <div style="display: flex; gap: 8px;">
                <!-- 수동 동기화 -->
                <button class="manual-sync-btn" id="btn-manual-sync" onclick="manualSync()" title="수동 동기화">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    수동 동기화
                </button>
                <!-- 일일 동기화 스케줄러 -->
                <div class="scheduler-status" id="daily-scheduler">
                    <div class="scheduler-indicator" id="daily-indicator"></div>
                    <div class="scheduler-info">
                        <span class="scheduler-label">일일 동기화</span>
                        <span class="scheduler-next" id="daily-next"></span>
                    </div>
                    <select class="scheduler-interval" id="daily-hour" onchange="updateDailyTime(this.value)"
                        title="매일 실행 시간">
                        <option value="0">00시</option>
                        <option value="1">01시</option>
                        <option value="2">02시</option>
                        <option value="3">03시</option>
                        <option value="4">04시</option>
                        <option value="5">05시</option>
                        <option value="6">06시</option>
                        <option value="7">07시</option>
                        <option value="8">08시</option>
                        <option value="9">09시</option>
                        <option value="10">10시</option>
                        <option value="11">11시</option>
                        <option value="12">12시</option>
                        <option value="13">13시</option>
                        <option value="14">14시</option>
                        <option value="15">15시</option>
                        <option value="16">16시</option>
                        <option value="17">17시</option>
                        <option value="18">18시</option>
                        <option value="19">19시</option>
                        <option value="20">20시</option>
                        <option value="21">21시</option>
                        <option value="22">22시</option>
                        <option value="23">23시</option>
                    </select>
                    <button class="scheduler-toggle" id="daily-toggle" onclick="toggleDailyScheduler()"
                        disabled>Stop</button>
                </div>

            </div>

            <button class="btn btn-secondary" id="btn-back">대시보드로 돌아가기</button>
        </div>
    </header>

    <div class="container">
        <!-- New Reviews Section -->
        <div class="review-card" style="margin-bottom: var(--spacing-lg);">
            <div class="review-header" style="user-select: none; display: flex; align-items: center;">
                <div class="review-title" style="cursor: pointer;" onclick="toggleNewReviews()">
                    신규 리뷰 <span class="review-count" id="newReviewCount">(0)</span>
                    <svg id="toggleIcon" class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2"
                        style="width: 20px; height: 20px; margin-left: 8px; transition: transform 0.3s ease;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="new-review-actions" id="newReviewActions" style="display: none;">
                    <label style="display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer;">
                        <input type="checkbox" class="review-checkbox" id="selectAllNew"
                            onchange="toggleSelectAllNew()" />
                        전체
                    </label>
                    <button class="btn-sm btn-primary-sm" id="btn-mark-selected" onclick="markSelectedAsRead()"
                        disabled>
                        선택 읽음
                    </button>
                    <button class="btn-sm" id="btn-mark-read" onclick="markAllAsRead()">
                        모두 읽음
                    </button>
                </div>
            </div>

            <div id="newReviewContainer" class="collapsible">
                <div class="loading" id="newReviewLoading">
                    <div class="spinner"></div>
                </div>
                <div class="review-list" id="newReviewList" style="display: none;"></div>
                <div class="empty-state" id="newReviewEmpty" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <span>신규 리뷰가 없습니다.</span>
                </div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="review-card" style="margin-bottom: var(--spacing-md);">
            <div class="review-header">
                <div class="review-title">전체 리뷰 검색</div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-card">
            <div class="filter-title">
                필터 조건
                <span class="cascade-hint">지역 → 업체·지점 순서로 선택</span>
            </div>

            <!-- Cascading Filters -->
            <div class="filter-cascade">
                <!-- Step 1: 지역 -->
                <div class="filter-step">
                    <div class="filter-group">
                        <label class="filter-label">
                            <span class="step-number">1</span>
                            지역
                            <span class="count-badge" id="regionCount">0</span>
                        </label>
                        <div class="filter-select-wrapper">
                            <select class="filter-select" id="regionSelect" onchange="onRegionChange()">
                                <option value="">전체 지역</option>
                            </select>
                        </div>
                        <div class="selected-chips" id="regionChips"></div>
                    </div>
                </div>

                <div class="arrow">→</div>

                <!-- Step 2: 업체·지점 -->
                <div class="filter-step">
                    <div class="filter-group">
                        <label class="filter-label">
                            <span class="step-number">2</span>
                            업체·지점
                            <span class="count-badge" id="branchCount">0</span>
                        </label>
                        <div class="filter-select-wrapper">
                            <select class="filter-select" id="branchSelect" onchange="onBranchChange()">
                                <option value="">업체·지점 선택...</option>
                            </select>
                        </div>
                        <div class="selected-chips" id="branchChips"></div>
                    </div>
                </div>
            </div>

            <!-- Additional Filters -->
            <div class="filter-row" style="justify-content: flex-end;">
                <div class="filter-group">
                    <label class="filter-label">감정</label>
                    <div class="filter-select-wrapper">
                        <select class="filter-select" id="sentimentFilter">
                            <option value="">전체</option>
                            <option value="positive">긍정</option>
                            <option value="negative">부정</option>
                            <option value="neutral">중립</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">정렬</label>
                    <div class="filter-select-wrapper">
                        <select class="filter-select" id="sortSelect">
                            <option value="latest">최신순</option>
                            <option value="rating_low">낮은 평점순</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">기간</label>
                    <input type="text" class="filter-input" id="dateRangeFilter" placeholder="기간 선택">
                </div>

                <div class="filter-actions">
                    <button class="btn btn-secondary" onclick="resetFilters()">초기화</button>
                    <button class="btn btn-primary" onclick="applyFilters()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                        검색
                    </button>
                </div>
            </div>
        </div>

        <!-- Search Results -->
        <div class="review-card">
            <div class="review-header">
                <div class="review-title">검색 결과</div>
                <div class="review-header-actions">
                    <div class="review-count" id="reviewCount">총 0건</div>
                    <button class="btn btn-export" onclick="exportToExcel()" id="exportBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path>
                            <polyline points="7,10 12,15 17,10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        엑셀 내보내기
                    </button>
                </div>
            </div>

            <div id="reviewListContainer">
                <div class="empty-state" id="searchPrompt">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                    <span>검색 조건을 입력하고 검색해주세요</span>
                </div>
                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <span id="loadingMessage" style="margin-top: 8px; color: #888; font-size: 13px;"></span>
                </div>
                <div class="review-list" id="reviewList" style="display: none;"></div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <span>조건에 맞는 리뷰가 없습니다.</span>
                </div>
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button class="page-btn" id="prevBtn" onclick="goToPage(currentPage - 1)">이전</button>
                <div id="pageNumbers"></div>
                <button class="page-btn" id="nextBtn" onclick="goToPage(currentPage + 1)">다음</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script src="{{ base_path }}/static/js/shared-utils.js"></script>
    <script>
        // API Prefix
        const API_PREFIX = '{{ api_prefix }}';
        // 페이지 경로용 base path
        const BASE_PATH = API_PREFIX.replace('/api', '');

        // Full data from API
        let allBranches = [];  // Contains: branch_id, branch_name, region, company_name
        let allRegions = [];

        // Selected filters (multi-select via chips)
        let selectedRegions = [];
        let selectedBranches = [];

        // Filtered options based on cascading
        let availableBranches = [];

        // Region simplification
        let regionMapping = {};        // 단순화이름 → [원본regions]
        let simplifiedRegionList = []; // 정렬된 단순화 이름 목록
        let selectedSimplified = [];   // 선택된 단순화 이름 (칩 표시용)

        // Pagination
        let currentPage = 1;
        let totalPages = 1;
        let totalCount = 0;
        let currentSort = 'latest';
        const pageSize = 5;

        // Date filter
        let dateFrom = null;
        let dateTo = null;

        // Search state
        let hasSearched = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // 헤더 네비게이션 버튼
            const btnBack = document.getElementById('btn-back');
            if (btnBack) {
                btnBack.addEventListener('click', () => {
                    window.location.href = `${BASE_PATH}/`;
                });
            }

            // 접기/펼치기 상태 복원
            restoreCollapseState();

            // 스케줄러 상태 확인
            checkAllSchedulers();

            // 동기화 상태 확인
            await checkSyncStatus();

            // Initialize date picker
            flatpickr('#dateRangeFilter', {
                mode: 'range',
                dateFormat: 'Y-m-d',
                locale: 'ko',
                onChange: function (selectedDates) {
                    if (selectedDates.length === 2) {
                        // 로컬 날짜 포맷 (타임존 문제 방지)
                        const formatLocalDate = (date) => {
                            const year = date.getFullYear();
                            const month = String(date.getMonth() + 1).padStart(2, '0');
                            const day = String(date.getDate()).padStart(2, '0');
                            return `${year}-${month}-${day}`;
                        };
                        dateFrom = formatLocalDate(selectedDates[0]);
                        dateTo = formatLocalDate(selectedDates[1]);
                    } else {
                        dateFrom = null;
                        dateTo = null;
                    }
                }
            });

            // Load filter options
            await loadFilterOptions();

            // Load new reviews (auto-load)
            await loadNewReviews();
        });

        // Load filter options from API
        async function loadFilterOptions() {
            try {
                const response = await fetch(`${API_PREFIX}/analysis/filters`);
                const result = await response.json();
                const data = result.data || result;

                allRegions = data.regions || [];
                allBranches = data.branches || [];

                // Build region mapping
                buildRegionMapping();

                // Initialize dropdowns
                updateRegionSelect();
                updateBranchSelect();

                // Update counts
                document.getElementById('regionCount').textContent = simplifiedRegionList.length;
                document.getElementById('branchCount').textContent = allBranches.length;

            } catch (error) {
                console.error('Failed to load filter options:', error);
            }
        }

        // Region simplification logic
        const METRO_CITIES = ['서울', '부산', '대구', '인천', '광주', '대전', '울산', '세종'];

        function simplifyRegion(region) {
            const parts = region.split(' ');
            const province = parts[0];

            // 광역시/특별시: 도시명만 반환
            if (METRO_CITIES.includes(province)) {
                return province;
            }

            // 제주
            if (province === '제주') {
                return '제주';
            }

            // 해외 등 단독 항목
            if (parts.length === 1) {
                return region;
            }

            // 도 지역: 시/군/구 접미사 제거
            const city = parts.slice(1).join(' ');
            return city.replace(/[시군구]$/, '');
        }

        function buildRegionMapping() {
            regionMapping = {};
            allRegions.forEach(region => {
                const simplified = simplifyRegion(region);
                if (!regionMapping[simplified]) regionMapping[simplified] = [];
                regionMapping[simplified].push(region);
            });
            simplifiedRegionList = Object.keys(regionMapping).sort();
        }

        // Update region dropdown (단순화)
        function updateRegionSelect() {
            const select = document.getElementById('regionSelect');
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '지역 선택...';
            select.replaceChildren(placeholder);

            simplifiedRegionList.forEach(name => {
                if (selectedSimplified.includes(name)) return;
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }

        // Update branch dropdown (업체별 optgroup으로 표시)
        function updateBranchSelect() {
            const select = document.getElementById('branchSelect');
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '업체·지점 선택...';
            select.replaceChildren(placeholder);

            // 지역 필터 적용
            availableBranches = allBranches.filter(b => {
                if (selectedRegions.length > 0 && !selectedRegions.includes(b.region)) {
                    return false;
                }
                if (selectedBranches.includes(b.branch_id)) {
                    return false;
                }
                return true;
            });

            // 업체별 그룹핑
            const grouped = {};
            availableBranches.forEach(b => {
                const company = b.company_name || '기타';
                if (!grouped[company]) grouped[company] = [];
                grouped[company].push(b);
            });

            // 업체명 정렬 후 optgroup으로 렌더링
            Object.keys(grouped).sort().forEach(company => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = company;

                grouped[company].sort((a, b) => (a.branch_name || '').localeCompare(b.branch_name || '')).forEach(branch => {
                    const option = document.createElement('option');
                    option.value = branch.branch_id;
                    option.textContent = branch.branch_name;
                    optgroup.appendChild(option);
                });

                select.appendChild(optgroup);
            });

            document.getElementById('branchCount').textContent = availableBranches.length;
        }

        // Region selection handler
        function onRegionChange() {
            const select = document.getElementById('regionSelect');
            const value = select.value;

            if (value && !selectedSimplified.includes(value)) {
                selectedSimplified.push(value);

                // 매핑된 원본 지역들을 selectedRegions에 추가
                const originals = regionMapping[value] || [];
                originals.forEach(r => {
                    if (!selectedRegions.includes(r)) {
                        selectedRegions.push(r);
                    }
                });

                renderChips('regionChips', selectedSimplified, removeRegion);

                // Reset downstream selections
                selectedBranches = [];
                renderBranchChips();
            }

            select.value = '';
            updateRegionSelect();
            updateBranchSelect();
        }

        // Branch selection handler
        function onBranchChange() {
            const select = document.getElementById('branchSelect');
            const value = parseInt(select.value);

            if (value && !selectedBranches.includes(value)) {
                selectedBranches.push(value);
                renderBranchChips();
            }

            select.value = '';
            updateBranchSelect();
        }

        // Render branch chips with "업체명 > 지점명" format (DOM API)
        function renderBranchChips() {
            const container = document.getElementById('branchChips');
            container.replaceChildren();

            selectedBranches.forEach(id => {
                const b = allBranches.find(x => x.branch_id === id);
                const label = b
                    ? (b.company_name ? `${b.company_name} > ${b.branch_name}` : b.branch_name)
                    : String(id);

                const chip = document.createElement('span');
                chip.className = 'chip';
                chip.textContent = label;

                const removeBtn = document.createElement('span');
                removeBtn.className = 'remove';
                removeBtn.textContent = '\u00D7';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeBranch(id);
                });

                chip.appendChild(removeBtn);
                container.appendChild(chip);
            });
        }

        // Remove region
        function removeRegion(simplified) {
            selectedSimplified = selectedSimplified.filter(s => s !== simplified);

            // 해당 단순화 이름에 매핑된 원본 지역들 제거
            const originals = regionMapping[simplified] || [];
            selectedRegions = selectedRegions.filter(r => !originals.includes(r));

            renderChips('regionChips', selectedSimplified, removeRegion);

            updateBranchSelect();
            selectedBranches = selectedBranches.filter(id =>
                availableBranches.some(b => b.branch_id === id)
            );
            renderBranchChips();

            updateRegionSelect();
        }

        // Remove branch
        function removeBranch(branchId) {
            selectedBranches = selectedBranches.filter(id => id !== branchId);
            renderBranchChips();
            updateBranchSelect();
        }

        // Render chips (DOM API - XSS safe)
        function renderChips(containerId, items, removeCallback) {
            const container = document.getElementById(containerId);
            container.replaceChildren();

            items.forEach(item => {
                const chip = document.createElement('span');
                chip.className = 'chip';
                chip.textContent = item;

                const removeBtn = document.createElement('span');
                removeBtn.className = 'remove';
                removeBtn.textContent = '\u00D7';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeCallback(item);
                });

                chip.appendChild(removeBtn);
                container.appendChild(chip);
            });
        }

        // Reset all filters
        function resetFilters() {
            selectedRegions = [];
            selectedSimplified = [];
            selectedBranches = [];
            dateFrom = null;
            dateTo = null;
            currentSort = 'latest';
            hasSearched = false;

            document.getElementById('sentimentFilter').value = '';
            document.getElementById('sortSelect').value = 'latest';
            flatpickr('#dateRangeFilter').clear();

            renderChips('regionChips', [], () => { });
            renderBranchChips();

            updateRegionSelect();
            updateBranchSelect();

            // Reset search results section to show prompt
            document.getElementById('searchPrompt').style.display = 'flex';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('reviewList').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';
            document.getElementById('reviewCount').textContent = '총 0건';
            document.getElementById('exportBtn').disabled = true;

            currentPage = 1;
        }

        // Apply filters and search
        function applyFilters() {
            currentPage = 1;
            currentSort = document.getElementById('sortSelect').value;
            hasSearched = true;
            loadReviews();
        }

        // Toggle new reviews section (접기/펼치기)
        function toggleNewReviews() {
            const container = document.getElementById('newReviewContainer');
            const icon = document.getElementById('toggleIcon');

            container.classList.toggle('collapsed');
            icon.classList.toggle('rotated');

            // 상태 저장 (localStorage)
            const isCollapsed = container.classList.contains('collapsed');
            localStorage.setItem('newReviewsCollapsed', isCollapsed);
        }

        // 페이지 로드 시 저장된 상태 복원
        function restoreCollapseState() {
            const isCollapsed = localStorage.getItem('newReviewsCollapsed') === 'true';
            if (isCollapsed) {
                const container = document.getElementById('newReviewContainer');
                const icon = document.getElementById('toggleIcon');
                container.classList.add('collapsed');
                icon.classList.add('rotated');
            }
        }

        // Load new reviews (신규 리뷰 섹션 - 자동 로드)
        async function loadNewReviews() {
            const loading = document.getElementById('newReviewLoading');
            const reviewList = document.getElementById('newReviewList');
            const emptyState = document.getElementById('newReviewEmpty');
            const countElement = document.getElementById('newReviewCount');

            loading.style.display = 'flex';
            reviewList.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                const params = new URLSearchParams({
                    is_new: 'true',
                    limit: 100,
                    offset: 0,
                    sort_by: 'latest'
                });

                const response = await fetch(`${API_PREFIX}/analysis/reviews?${params}`);
                const result = await response.json();
                const data = result.data || result;

                const count = data.total || 0;
                countElement.textContent = `(${count})`;

                if (data.reviews && data.reviews.length > 0) {
                    renderNewReviews(data.reviews);
                    reviewList.style.display = 'block';
                } else {
                    renderNewReviews([]);
                    emptyState.style.display = 'flex';
                }

            } catch (error) {
                console.error('Failed to load new reviews:', error);
                emptyState.style.display = 'flex';
            } finally {
                loading.style.display = 'none';
            }
        }

        // Render new reviews (DOM API 사용)
        function renderNewReviews(reviews) {
            const reviewList = document.getElementById('newReviewList');
            reviewList.replaceChildren();

            reviews.forEach(review => {
                const reviewItem = createReviewElement(review, true);
                reviewList.appendChild(reviewItem);
            });

            // 액션 버튼 표시/숨기기
            const actions = document.getElementById('newReviewActions');
            if (actions) {
                actions.style.display = reviews.length > 0 ? 'flex' : 'none';
            }
            // 전체 선택 초기화
            const selectAll = document.getElementById('selectAllNew');
            if (selectAll) selectAll.checked = false;
            updateSelectedCount();
        }

        // 선택 개수 갱신
        function updateSelectedCount() {
            const checked = document.querySelectorAll('#newReviewList .review-checkbox:checked');
            const btn = document.getElementById('btn-mark-selected');
            if (btn) {
                btn.disabled = checked.length === 0;
            }
        }

        // 전체 선택/해제
        function toggleSelectAllNew() {
            const selectAll = document.getElementById('selectAllNew');
            const checkboxes = document.querySelectorAll('#newReviewList .review-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateSelectedCount();
        }

        // 선택 읽음 처리
        async function markSelectedAsRead() {
            const checked = document.querySelectorAll('#newReviewList .review-checkbox:checked');
            if (checked.length === 0) return;

            const reviewIds = Array.from(checked).map(cb => parseInt(cb.dataset.reviewId));

            if (!confirm(`${reviewIds.length}개의 선택된 리뷰를 읽음 처리하시겠습니까?`)) return;

            const btn = document.getElementById('btn-mark-selected');
            btn.disabled = true;
            btn.textContent = '처리 중...';

            try {
                const response = await fetch(`${API_PREFIX}/sync/reviews/read`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review_ids: reviewIds })
                });
                const data = await response.json();

                if (data.success) {
                    await checkSyncStatus();
                    await loadNewReviews();
                    if (hasSearched) await loadReviews();
                }
            } catch (error) {
                console.error('Failed to mark selected as read:', error);
                showToast('읽음 처리 중 오류가 발생했습니다.', 'error');
            } finally {
                const btn = document.getElementById('btn-mark-selected');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = '선택 읽음';
                }
            }
        }

        // Create review element using DOM API
        function createReviewElement(review, isNewSection = false) {
            const reviewItem = document.createElement('div');
            reviewItem.className = review.is_new === true ? 'review-item is-new' : 'review-item';
            if (review.review_id) {
                reviewItem.setAttribute('data-id', review.review_id);
            }

            // 신규 리뷰 섹션: 체크박스 추가
            if (isNewSection && review.review_id) {
                reviewItem.classList.add('has-checkbox');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'review-checkbox';
                checkbox.dataset.reviewId = review.review_id;
                checkbox.onchange = () => {
                    updateSelectedCount();
                    // 전체 선택 체크박스 동기화
                    const all = document.querySelectorAll('#newReviewList .review-checkbox');
                    const checked = document.querySelectorAll('#newReviewList .review-checkbox:checked');
                    const selectAll = document.getElementById('selectAllNew');
                    if (selectAll) selectAll.checked = all.length === checked.length;
                };
                checkbox.onclick = (e) => e.stopPropagation();
                reviewItem.appendChild(checkbox);
            }

            // Wrap content for checkbox layout
            const contentWrap = isNewSection ? document.createElement('div') : null;
            if (contentWrap) contentWrap.className = 'review-content-wrap';

            // Meta container
            const reviewMeta = document.createElement('div');
            reviewMeta.className = 'review-meta';

            // Info section
            const reviewInfo = document.createElement('div');
            reviewInfo.className = 'review-info';

            const companySpan = document.createElement('span');
            companySpan.className = 'info-company';
            companySpan.textContent = review.company_name || '-';
            reviewInfo.appendChild(companySpan);

            const branchSpan = document.createElement('span');
            branchSpan.className = 'info-branch';
            branchSpan.textContent = review.branch_name || '-';
            reviewInfo.appendChild(branchSpan);

            const dateSpan = document.createElement('span');
            dateSpan.className = 'info-date';
            dateSpan.textContent = review.review_date
                ? new Date(review.review_date).toLocaleDateString('ko-KR')
                : '-';
            reviewInfo.appendChild(dateSpan);

            const idSpan = document.createElement('span');
            idSpan.className = 'info-id';
            idSpan.textContent = `#${review.review_id || '-'}`;
            idSpan.title = '운영툴에서 보기';
            idSpan.onclick = () => {
                const reviewId = review.review_id || '-';
                const reviewDate = review.review_date ? review.review_date.split('T')[0] : '';
                const dbId = review.review_id || null;
                openReservation(reviewId, reviewDate, dbId, isNewSection);
            };
            reviewInfo.appendChild(idSpan);

            if (review.is_new === true) {
                const newTag = document.createElement('span');
                newTag.className = 'new-tag';
                newTag.textContent = 'NEW';
                reviewInfo.appendChild(newTag);
            }

            reviewMeta.appendChild(reviewInfo);

            // Ratings section
            const reviewRatings = document.createElement('div');
            reviewRatings.className = 'review-ratings';

            const ratingService = review.rating_service != null ? review.rating_service.toFixed(1) : '-';
            const ratingCar = review.rating_car != null ? review.rating_car.toFixed(1) : '-';
            const ratingConv = review.rating_convenience != null ? review.rating_convenience.toFixed(1) : '-';

            const serviceRating = document.createElement('span');
            serviceRating.className = 'rating-item';
            serviceRating.title = '친절/편의성';
            serviceRating.textContent = `서비스 ${ratingService}`;
            reviewRatings.appendChild(serviceRating);

            const carRating = document.createElement('span');
            carRating.className = 'rating-item';
            carRating.title = '차량평점';
            carRating.textContent = `차량 ${ratingCar}`;
            reviewRatings.appendChild(carRating);

            const convRating = document.createElement('span');
            convRating.className = 'rating-item';
            convRating.title = '인수/반납편의성';
            convRating.textContent = `편의성 ${ratingConv}`;
            reviewRatings.appendChild(convRating);

            // Sentiment badge
            if (review.sentiment) {
                const sentimentBadge = document.createElement('span');
                sentimentBadge.className = 'review-sentiment ' + review.sentiment;
                const sentimentLabels = { positive: '긍정', negative: '부정', neutral: '중립' };
                sentimentBadge.textContent = sentimentLabels[review.sentiment] || review.sentiment;
                reviewRatings.appendChild(sentimentBadge);
            }

            reviewMeta.appendChild(reviewRatings);

            // Content section
            const reviewContent = document.createElement('div');
            reviewContent.className = 'review-content';
            reviewContent.textContent = review.content || '-';

            if (contentWrap) {
                contentWrap.appendChild(reviewMeta);
                contentWrap.appendChild(reviewContent);
                reviewItem.appendChild(contentWrap);
            } else {
                reviewItem.appendChild(reviewMeta);
                reviewItem.appendChild(reviewContent);
            }

            return reviewItem;
        }

        // Export to Excel
        async function exportToExcel() {
            const exportBtn = document.getElementById('exportBtn');
            const originalText = exportBtn.innerHTML;

            // 버튼 비활성화 및 로딩 표시
            exportBtn.disabled = true;
            exportBtn.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spinning">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 6v6l4 2"></path>
                </svg>
                내보내는 중...
            `;

            try {
                const params = new URLSearchParams({
                    sort_by: currentSort
                });

                // Add filters
                if (selectedRegions.length > 0) {
                    selectedRegions.forEach(r => params.append('regions', r));
                }
                if (selectedBranches.length > 0) {
                    selectedBranches.forEach(b => params.append('branch_ids', b));
                }

                const sentiment = document.getElementById('sentimentFilter').value;
                if (sentiment) {
                    params.append('sentiment', sentiment);
                }
                if (dateFrom) {
                    params.append('date_from', dateFrom);
                }
                if (dateTo) {
                    params.append('date_to', dateTo);
                }

                const response = await fetch(`${API_PREFIX}/analysis/reviews/export?${params}`);

                if (!response.ok) {
                    throw new Error('Export failed');
                }

                // Blob으로 변환 후 다운로드
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;

                // Content-Disposition 헤더에서 파일명 추출
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = '리뷰_내보내기.xlsx';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename\*?=['"]?(?:UTF-8'')?([^;\n"']+)/i);
                    if (filenameMatch && filenameMatch[1]) {
                        filename = decodeURIComponent(filenameMatch[1]);
                    }
                }

                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch (error) {
                console.error('Failed to export reviews:', error);
                showToast('리뷰 내보내기에 실패했습니다.', 'error');
            } finally {
                // 버튼 복원
                exportBtn.disabled = false;
                exportBtn.innerHTML = originalText;
            }
        }

        // Load reviews from API (검색 결과 섹션)
        async function loadReviews() {
            const loading = document.getElementById('loading');
            const reviewList = document.getElementById('reviewList');
            const emptyState = document.getElementById('emptyState');
            const pagination = document.getElementById('pagination');
            const searchPrompt = document.getElementById('searchPrompt');

            // Hide search prompt once search is performed
            if (hasSearched) {
                searchPrompt.style.display = 'none';
            }

            loading.style.display = 'flex';
            reviewList.style.display = 'none';
            emptyState.style.display = 'none';
            pagination.style.display = 'none';

            // Athena 검색 여부에 따라 로딩 메시지 표시
            const loadingMsg = document.getElementById('loadingMessage');

            try {
                const params = new URLSearchParams({
                    limit: pageSize,
                    offset: (currentPage - 1) * pageSize,
                    sort_by: currentSort
                });

                // Add filters
                if (selectedRegions.length > 0) {
                    selectedRegions.forEach(r => params.append('regions', r));
                }
                if (selectedBranches.length > 0) {
                    selectedBranches.forEach(b => params.append('branch_ids', b));
                }

                const sentiment = document.getElementById('sentimentFilter').value;
                if (sentiment) {
                    params.append('sentiment', sentiment);
                }
                if (dateFrom) {
                    params.append('date_from', dateFrom);
                }
                if (dateTo) {
                    params.append('date_to', dateTo);
                }

                // sentiment/is_new 없으면 Athena 경로 → 로딩 메시지 변경
                const isNewFilter = document.getElementById('isNewFilter');
                const isNewVal = isNewFilter ? isNewFilter.value : '';
                const useAthena = !sentiment && !isNewVal;
                if (useAthena) {
                    loadingMsg.textContent = '전체 리뷰 검색 중... (2~4초 소요)';
                } else {
                    loadingMsg.textContent = '';
                }

                const response = await fetch(`${API_PREFIX}/analysis/reviews?${params}`);
                const result = await response.json();
                const data = result.data || result;

                totalCount = data.total || 0;
                totalPages = Math.ceil(totalCount / pageSize) || 1;

                // 현재 페이지가 총 페이지 수를 초과하면 마지막 페이지로 조정
                if (currentPage > totalPages && totalCount > 0) {
                    currentPage = totalPages;
                    loading.style.display = 'none';
                    return loadReviews();
                }

                document.getElementById('reviewCount').textContent = `총 ${totalCount.toLocaleString()}건`;

                // 내보내기 버튼 활성화/비활성화
                document.getElementById('exportBtn').disabled = totalCount === 0;

                if (data.reviews && data.reviews.length > 0) {
                    renderReviews(data.reviews);
                    reviewList.style.display = 'block';
                    if (totalPages > 1) {
                        renderPagination();
                        pagination.style.display = 'flex';
                    }
                } else {
                    emptyState.style.display = 'flex';
                }

            } catch (error) {
                console.error('Failed to load reviews:', error);
                emptyState.style.display = 'flex';
            } finally {
                loading.style.display = 'none';
                loadingMsg.textContent = '';
            }
        }

        // Render reviews (검색 결과 섹션 - DOM API 사용)
        function renderReviews(reviews) {
            const reviewList = document.getElementById('reviewList');
            reviewList.replaceChildren();

            reviews.forEach(review => {
                const reviewItem = createReviewElement(review, false);
                reviewList.appendChild(reviewItem);
            });
        }

        // 운영툴에서 예약 보기 + 해당 리뷰 읽음 처리
        async function openReservation(reviewId, reviewDate, dbId, isNewSection = false) {
            if (reviewId && reviewId !== '-') {
                let url = `https://dev-admin.carmore.kr/partners/Reviewmanage?sp=reservation_idx&sv=${reviewId}`;
                if (reviewDate) {
                    url += `&startdate=${reviewDate}&enddate=${reviewDate}`;
                }
                window.open(url, '_blank');

                // 해당 리뷰 읽음 처리 (DB ID가 있는 경우)
                if (dbId) {
                    await markReviewAsRead(dbId, isNewSection);
                }
            }
        }

        // 단일 리뷰 읽음 처리
        async function markReviewAsRead(dbId, isNewSection = false) {
            try {
                const response = await fetch(`${API_PREFIX}/sync/reviews/read`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review_ids: [dbId] })
                });
                const data = await response.json();

                if (data.success && data.marked_count > 0) {
                    if (isNewSection) {
                        // 신규 리뷰 섹션: API 재조회로 개수 통일
                        await loadNewReviews();
                    } else {
                        // 검색 결과 섹션에서 클릭한 경우: NEW 태그만 제거
                        const reviewItem = document.querySelector(`#reviewList .review-item[data-id="${dbId}"]`);
                        if (reviewItem) {
                            reviewItem.classList.remove('is-new');
                            const newTag = reviewItem.querySelector('.new-tag');
                            if (newTag) newTag.remove();
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to mark review as read:', error);
            }
        }

        // Render pagination (순차 탐색만 허용 - 마지막 페이지 점프 불가)
        function renderPagination() {
            const pageNumbers = document.getElementById('pageNumbers');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) {
                startPage = Math.max(1, endPage - 4);
            }

            let html = '';
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            pageNumbers.innerHTML = html;
        }

        // Go to page
        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadReviews();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // =============================================
        // 수동 동기화 (비동기 폴링)
        // =============================================
        let syncAbortController = null;

        function createSyncProgressOverlay() {
            const overlay = document.createElement('div');
            overlay.className = 'sync-progress-overlay';
            overlay.id = 'sync-progress-overlay';

            const card = document.createElement('div');
            card.className = 'sync-progress-card';

            const title = document.createElement('h3');
            title.textContent = '리뷰 동기화 중...';

            const barWrap = document.createElement('div');
            barWrap.className = 'sync-progress-bar-wrap';

            const barFill = document.createElement('div');
            barFill.className = 'sync-progress-bar-fill';
            barFill.id = 'sync-progress-fill';
            barWrap.appendChild(barFill);

            const text = document.createElement('div');
            text.className = 'sync-progress-text';
            text.id = 'sync-progress-text';
            text.textContent = '준비 중...';

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'sync-progress-cancel-btn';
            cancelBtn.textContent = '취소';
            cancelBtn.id = 'sync-cancel-btn';

            card.appendChild(title);
            card.appendChild(barWrap);
            card.appendChild(text);
            card.appendChild(cancelBtn);
            overlay.appendChild(card);

            return overlay;
        }

        function updateSyncProgress(progress, message) {
            const fill = document.getElementById('sync-progress-fill');
            const text = document.getElementById('sync-progress-text');
            if (fill) fill.style.width = progress + '%';
            if (text) text.textContent = message || (progress + '%');
        }

        function removeSyncOverlay() {
            const overlay = document.getElementById('sync-progress-overlay');
            if (overlay) overlay.remove();
        }

        async function manualSync() {
            const btn = document.getElementById('btn-manual-sync');
            if (btn.disabled) return;

            btn.disabled = true;
            btn.classList.add('syncing');

            // 프로그레스 오버레이 표시
            const overlay = createSyncProgressOverlay();
            document.body.appendChild(overlay);

            syncAbortController = new AbortController();
            let currentJobId = null;

            // 취소 버튼 이벤트
            const cancelBtn = document.getElementById('sync-cancel-btn');
            cancelBtn.addEventListener('click', async () => {
                if (syncAbortController) syncAbortController.abort();
                if (currentJobId) {
                    try {
                        await fetch(`${API_PREFIX}/sync/jobs/${currentJobId}`, {
                            method: 'DELETE',
                        });
                    } catch (e) { /* ignore */ }
                }
                removeSyncOverlay();
                btn.disabled = false;
                btn.classList.remove('syncing');
            });

            try {
                // 1. 비동기 작업 제출
                const submitRes = await fetch(`${API_PREFIX}/sync/reviews`, {
                    method: 'POST',
                    signal: syncAbortController.signal,
                });

                if (!submitRes.ok) {
                    const err = await submitRes.json();
                    throw new Error(err.detail || '동기화 시작 실패');
                }

                const submitData = (await submitRes.json()).data;
                currentJobId = submitData.job_id;
                updateSyncProgress(submitData.progress, submitData.message || '작업 시작됨');

                // 2. 폴링 (2초 간격, 최대 90회 = 3분)
                const MAX_POLLS = 90;
                let polls = 0;

                while (polls < MAX_POLLS) {
                    await new Promise(r => setTimeout(r, 2000));
                    polls++;

                    const pollRes = await fetch(`${API_PREFIX}/sync/jobs/${currentJobId}`, {
                        signal: syncAbortController.signal,
                    });

                    if (!pollRes.ok) {
                        throw new Error('상태 조회 실패');
                    }

                    const status = (await pollRes.json()).data;
                    updateSyncProgress(status.progress, status.message);

                    if (status.status === 'completed') {
                        updateSyncProgress(100, '동기화 완료!');
                        await new Promise(r => setTimeout(r, 500));
                        removeSyncOverlay();

                        const result = status.result;
                        if (result) {
                            const msg = result.new_reviews > 0
                                ? `동기화 완료: 신규 리뷰 ${result.new_reviews}건`
                                : '동기화 완료: 신규 리뷰가 없습니다.';
                            showToast(msg, 'success');

                            await checkSyncStatus();
                            if (result.new_reviews > 0) {
                                await loadNewReviews();
                                await loadReviews();
                            }
                        }
                        return;
                    }

                    if (status.status === 'failed') {
                        removeSyncOverlay();
                        showToast(status.error || status.message || '동기화에 실패했습니다.', 'error');
                        return;
                    }
                }

                // 타임아웃
                removeSyncOverlay();
                showToast('동기화 시간이 초과되었습니다. 잠시 후 다시 시도해주세요.', 'error');

            } catch (error) {
                removeSyncOverlay();
                if (error.name !== 'AbortError') {
                    console.error('Manual sync failed:', error);
                    showToast('동기화 중 오류가 발생했습니다.', 'error');
                }
            } finally {
                syncAbortController = null;
                btn.disabled = false;
                btn.classList.remove('syncing');
            }
        }

        // =============================================
        // 스케줄러 관련 함수
        // =============================================

        // 모든 스케줄러 상태 확인
        function checkAllSchedulers() {
            checkDailyScheduler();
        }

        // 1. 일일 동기화 스케줄러 (SyncScheduler)
        async function checkDailyScheduler() {
            try {
                const response = await fetch(`${API_PREFIX}/sync/scheduler/status`);
                const data = (await response.json()).data;

                const indicator = document.getElementById('daily-indicator');
                const nextRun = document.getElementById('daily-next');
                const toggleBtn = document.getElementById('daily-toggle');
                const hourSelect = document.getElementById('daily-hour');

                // 시간 선택 설정
                hourSelect.value = data.sync_hour;

                if (data.is_running) {
                    indicator.classList.add('active');
                    if (toggleBtn) toggleBtn.style.display = 'none';

                    if (data.next_run_time) {
                        const next = new Date(data.next_run_time);
                        const hours = String(next.getHours()).padStart(2, '0');
                        const minutes = String(next.getMinutes()).padStart(2, '0');
                        nextRun.textContent = `다음: ${hours}:${minutes}`;
                    } else {
                        nextRun.textContent = '';
                    }
                } else {
                    indicator.classList.remove('active');
                    nextRun.textContent = '중지됨';
                    if (toggleBtn) toggleBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('Failed to check daily scheduler:', error);
            }
        }

        async function toggleDailyScheduler() {
            const toggleBtn = document.getElementById('daily-toggle');
            const isRunning = toggleBtn.dataset.running === 'true';

            toggleBtn.disabled = true;
            toggleBtn.textContent = '...';

            try {
                const endpoint = isRunning ? 'stop' : 'start';
                const response = await fetch(`${API_PREFIX}/sync/scheduler/${endpoint}`, {
                    method: 'POST'
                });
                await checkDailyScheduler();
            } catch (error) {
                console.error('Failed to toggle daily scheduler:', error);
                showToast('상태 변경 실패', 'error');
                toggleBtn.disabled = false;
            }
        }

        async function updateDailyTime(hour) {
            try {
                const response = await fetch(`${API_PREFIX}/sync/scheduler/time`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hour: parseInt(hour), minute: 0 })
                });

                if (!response.ok) throw new Error('Failed');
                await checkDailyScheduler();
            } catch (error) {
                console.error('Failed to update daily time:', error);
                showToast('시간 변경 실패', 'error');
                await checkDailyScheduler();
            }
        }

        async function checkSyncStatus() {

        }

        // 전체 읽음 처리
        async function markAllAsRead() {
            const countEl = document.getElementById('newReviewCount');
            const count = countEl ? countEl.textContent.replace(/[()]/g, '') || '0' : '0';

            if (!confirm(`${count}개의 신규 리뷰를 모두 읽음 처리하시겠습니까?`)) {
                return;
            }

            const btn = document.getElementById('btn-mark-read');
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = '처리 중...';

            try {
                const response = await fetch(`${API_PREFIX}/sync/reviews/read`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review_ids: null })
                });
                const data = await response.json();

                if (data.success) {
                    await checkSyncStatus();
                    await loadNewReviews();
                    if (hasSearched) {
                        await loadReviews();
                    }
                }
            } catch (error) {
                console.error('Failed to mark all as read:', error);
                showToast('읽음 처리 중 오류가 발생했습니다.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '모두 읽음';
            }
        }
