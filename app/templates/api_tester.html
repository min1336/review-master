<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 테스트 - Review Summary AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ base_path }}/static/css/shared-theme.css">
    <style>
        :root {
            --primary-light: #e8f0fe;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --radius: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .header {
            background: white;
            border-bottom: 1px solid var(--grey-7);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--grey-3);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input::placeholder {
            color: var(--grey-5);
        }

        .url-builder {
            display: flex;
            align-items: center;
            gap: 0;
            border: 1px solid var(--grey-7);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .url-builder:focus-within {
            border-color: var(--primary);
        }

        .url-prefix {
            padding: 10px 14px;
            background: var(--grey-8);
            color: var(--grey-5);
            font-size: 14px;
            white-space: nowrap;
            border-right: 1px solid var(--grey-7);
            user-select: all;
        }

        .url-builder input {
            border: none;
            border-radius: 0;
            flex: 1;
            min-width: 80px;
        }

        .url-builder input:focus {
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            background: var(--grey-5);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--grey-8);
            color: var(--grey-3);
        }

        .btn-secondary:hover {
            background: var(--grey-7);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--grey-5);
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn:hover {
            background: var(--grey-9);
            color: var(--grey-3);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--primary-light);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Loading */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--grey-7);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results */
        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .status-badge.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .result-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .meta-item {
            background: var(--grey-9);
            padding: 12px 16px;
            border-radius: var(--radius);
        }

        .meta-label {
            font-size: 12px;
            color: var(--grey-5);
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 14px;
            font-weight: 500;
        }

        .summary-text {
            background: var(--grey-9);
            padding: 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .error-message {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 16px;
            border-radius: var(--radius);
            font-size: 14px;
            border-left: 4px solid var(--error);
        }

        .hint {
            font-size: 12px;
            color: var(--grey-5);
            margin-top: 6px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Vehicle table */
        .vehicle-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 8px;
        }

        .vehicle-table th,
        .vehicle-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--grey-7);
        }

        .vehicle-table th {
            background: var(--grey-9);
            font-weight: 600;
            font-size: 12px;
            color: var(--grey-5);
        }

        .vehicle-table tr:last-child td {
            border-bottom: none;
        }

        .ratio-bar {
            display: inline-block;
            height: 6px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .ratio-bar.positive {
            background: var(--success);
        }

        .ratio-bar.negative {
            background: var(--error);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--grey-3);
            margin-bottom: 8px;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>API 테스트</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" id="btn-back">대시보드</button>
        </div>
    </header>

    <div class="container">
        <!-- API Key (공통) -->
        <div class="card">
            <div class="card-title">인증</div>
            <div class="form-group">
                <label class="form-label">X-API-Key</label>
                <input type="text" id="apiKeyInput" placeholder="API 키를 입력하세요">
                <div class="hint">Public API 접근에 필요한 API 키입니다.</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="summary">Review Summary</button>
            <button class="tab-btn" data-tab="report">AI Report</button>
        </div>

        <!-- Summary Tab -->
        <div class="tab-panel active" id="tab-summary">
            <div class="card">
                <div class="card-title">요청</div>
                <div class="form-group">
                    <label class="form-label">Branch ID</label>
                    <div class="url-builder">
                        <span class="url-prefix" id="summaryUrlPrefix"></span>
                        <input type="number" id="summaryBranchId" placeholder="지점 ID (숫자)" min="1">
                    </div>
                    <div class="hint">GET /public/{branch_id} - 해당 지점의 최신 요약을 조회합니다.</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="summaryExecuteBtn">실행</button>
                    <button class="btn btn-secondary" id="summaryClearBtn">초기화</button>
                </div>
            </div>
        </div>

        <!-- Report Tab -->
        <div class="tab-panel" id="tab-report">
            <div class="card">
                <div class="card-title">요청</div>
                <div class="form-group">
                    <label class="form-label">Branch ID</label>
                    <div class="url-builder">
                        <span class="url-prefix" id="reportUrlPrefix"></span>
                        <input type="number" id="reportBranchId" placeholder="지점 ID (숫자)" min="1">
                    </div>
                    <div class="hint">GET /public/report/{branch_id} - AI 리포트를 조회합니다.</div>
                </div>
                <div class="form-group">
                    <label class="form-label">분석 기간</label>
                    <div class="date-row">
                        <input type="date" id="reportStartDate">
                        <input type="date" id="reportEndDate">
                    </div>
                    <div class="hint">리포트 분석 기간을 설정합니다.</div>
                </div>
                <div class="form-group">
                    <label class="form-label">차량 Top N</label>
                    <input type="number" id="reportVehicleTop" value="5" min="1" max="100" style="width:120px;">
                    <div class="hint">차량별 평가 상위 N개 (기본 5, 호평률 순)</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="reportExecuteBtn">실행</button>
                    <button class="btn btn-secondary" id="reportClearBtn">초기화</button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <!-- Results -->
        <div class="results" id="results">
            <div class="card" id="resultCard"></div>
        </div>
    </div>

    <script src="{{ base_path }}/static/js/shared-utils.js"></script>
    <script>
        const API_PREFIX = '{{ api_prefix }}';
        const BASE_PATH = API_PREFIX.replace('/api', '');
        let activeTab = 'summary';

        document.addEventListener('DOMContentLoaded', () => {
            const btnBack = document.getElementById('btn-back');
            if (btnBack) {
                btnBack.addEventListener('click', () => {
                    window.location.href = BASE_PATH + '/';
                });
            }

            // URL prefixes
            const origin = window.location.origin + BASE_PATH;
            document.getElementById('summaryUrlPrefix').textContent = origin + '/public/';
            document.getElementById('reportUrlPrefix').textContent = origin + '/public/report/';

            // 기본 날짜 설정 (최근 3개월)
            const today = new Date();
            const threeMonthsAgo = new Date(today);
            threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
            document.getElementById('reportEndDate').value = formatDateForAPI(today);
            document.getElementById('reportStartDate').value = formatDateForAPI(threeMonthsAgo);

            // Tab 전환
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    activeTab = tab;

                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

                    btn.classList.add('active');
                    document.getElementById('tab-' + tab).classList.add('active');

                    document.getElementById('results').classList.remove('show');
                });
            });

            // Summary 이벤트
            document.getElementById('summaryExecuteBtn').addEventListener('click', executeSummary);
            document.getElementById('summaryClearBtn').addEventListener('click', () => {
                document.getElementById('summaryBranchId').value = '';
                document.getElementById('results').classList.remove('show');
            });
            document.getElementById('summaryBranchId').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') executeSummary();
            });

            // Report 이벤트
            document.getElementById('reportExecuteBtn').addEventListener('click', executeReport);
            document.getElementById('reportClearBtn').addEventListener('click', () => {
                document.getElementById('reportBranchId').value = '';
                document.getElementById('results').classList.remove('show');
            });
            document.getElementById('reportBranchId').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') executeReport();
            });

            // API Key Enter
            document.getElementById('apiKeyInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (activeTab === 'summary') executeSummary();
                    else executeReport();
                }
            });
        });

        // formatDateForAPI: shared-utils.js에서 제공

        function getApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                showToast('API 키를 입력해주세요.', 'warning');
                document.getElementById('apiKeyInput').focus();
                return null;
            }
            return key;
        }

        function showLoading(btnId) {
            document.getElementById(btnId).disabled = true;
            document.getElementById(btnId).textContent = '요청 중...';
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');
        }

        function hideLoading(btnId, label) {
            document.getElementById(btnId).disabled = false;
            document.getElementById(btnId).textContent = label || '실행';
            document.getElementById('loading').classList.remove('show');
        }

        /* ========== Summary ========== */

        async function executeSummary() {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const branchId = document.getElementById('summaryBranchId').value.trim();
            if (!branchId) {
                showToast('Branch ID를 입력해주세요.', 'warning');
                document.getElementById('summaryBranchId').focus();
                return;
            }

            showLoading('summaryExecuteBtn');

            try {
                const url = window.location.origin + BASE_PATH + '/public/' + encodeURIComponent(branchId);
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-API-Key': apiKey }
                });

                const resultCard = document.getElementById('resultCard');

                if (response.ok) {
                    const data = await response.json();
                    renderSummarySuccess(resultCard, data);
                } else {
                    handleError(resultCard, response);
                }

                document.getElementById('results').classList.add('show');
            } catch (error) {
                const resultCard = document.getElementById('resultCard');
                renderError(resultCard, 'Network Error', error.message);
                document.getElementById('results').classList.add('show');
            } finally {
                hideLoading('summaryExecuteBtn');
            }
        }

        function renderSummarySuccess(container, data) {
            const card = document.createElement('div');

            const metaGrid = document.createElement('div');
            metaGrid.className = 'result-meta';

            const metaItems = [
                { label: 'Branch ID', value: data.branch_id },
                { label: '지점명', value: data.branch_name || '-' },
                { label: '지역', value: data.region || '-' },
                { label: '리뷰 수', value: data.review_count != null ? data.review_count + '건' : '-' },
                { label: '평균 평점', value: data.avg_rating != null ? Number(data.avg_rating).toFixed(1) + '점' : '-' },
                { label: '업데이트', value: data.updated_at ? new Date(data.updated_at).toLocaleDateString('ko-KR') : '-' },
            ];

            metaItems.forEach(item => {
                const metaItem = document.createElement('div');
                metaItem.className = 'meta-item';

                const label = document.createElement('div');
                label.className = 'meta-label';
                label.textContent = item.label;

                const value = document.createElement('div');
                value.className = 'meta-value';
                value.textContent = String(item.value);

                metaItem.appendChild(label);
                metaItem.appendChild(value);
                metaGrid.appendChild(metaItem);
            });
            card.appendChild(metaGrid);

            const sectionTitle = document.createElement('div');
            sectionTitle.className = 'section-title';
            sectionTitle.textContent = '요약';
            card.appendChild(sectionTitle);

            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary-text ' + statusLabel;
            summaryDiv.textContent = data.summary || '-';
            card.appendChild(summaryDiv);

            container.replaceChildren(card);
        }

        /* ========== Report ========== */

        async function executeReport() {
            const apiKey = getApiKey();
            if (!apiKey) return;

            const branchId = document.getElementById('reportBranchId').value.trim();
            if (!branchId) {
                showToast('Branch ID를 입력해주세요.', 'warning');
                document.getElementById('reportBranchId').focus();
                return;
            }

            const startDate = document.getElementById('reportStartDate').value;
            const endDate = document.getElementById('reportEndDate').value;
            if (!startDate || !endDate) {
                showToast('분석 기간을 설정해주세요.', 'warning');
                return;
            }

            const vehicleTop = document.getElementById('reportVehicleTop').value || 5;

            showLoading('reportExecuteBtn');

            try {
                const params = new URLSearchParams({
                    start_date: startDate,
                    end_date: endDate,
                    vehicle_top: vehicleTop,
                });
                const url = window.location.origin + BASE_PATH +
                    '/public/report/' + encodeURIComponent(branchId) + '?' + params.toString();

                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-API-Key': apiKey }
                });

                const resultCard = document.getElementById('resultCard');

                if (response.ok) {
                    const data = await response.json();
                    renderReportSuccess(resultCard, data);
                } else {
                    handleError(resultCard, response);
                }

                document.getElementById('results').classList.add('show');
            } catch (error) {
                const resultCard = document.getElementById('resultCard');
                renderError(resultCard, 'Network Error', error.message);
                document.getElementById('results').classList.add('show');
            } finally {
                hideLoading('reportExecuteBtn');
            }
        }

        function renderReportSuccess(container, data) {
            const card = document.createElement('div');

            // Badge
            const badge = document.createElement('span');
            badge.className = 'status-badge';
            badge.textContent = 'AI Report';
            card.appendChild(badge);

            // Meta
            const metaGrid = document.createElement('div');
            metaGrid.className = 'result-meta';

            const metaItems = [
                { label: 'Branch ID', value: data.branch_id },
                { label: '지점명', value: data.branch_name || '-' },
                { label: '지역', value: data.region || '-' },
                { label: '분석 기간', value: data.period || '-' },
                { label: '총 리뷰', value: data.total_reviews != null ? data.total_reviews + '건' : '-' },
                { label: '생성일', value: data.generated_at || '-' },
            ];

            metaItems.forEach(item => {
                const metaItem = document.createElement('div');
                metaItem.className = 'meta-item';

                const label = document.createElement('div');
                label.className = 'meta-label';
                label.textContent = item.label;

                const value = document.createElement('div');
                value.className = 'meta-value';
                value.textContent = String(item.value);

                metaItem.appendChild(label);
                metaItem.appendChild(value);
                metaGrid.appendChild(metaItem);
            });
            card.appendChild(metaGrid);

            // Period Summary
            const sumTitle = document.createElement('div');
            sumTitle.className = 'section-title';
            sumTitle.textContent = '기간별 요약';
            card.appendChild(sumTitle);

            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary-text';
            summaryDiv.textContent = data.period_summary || '-';
            card.appendChild(summaryDiv);

            // Vehicle Analysis
            if (data.vehicle_analysis && data.vehicle_analysis.length > 0) {
                const vTitle = document.createElement('div');
                vTitle.className = 'section-title';
                vTitle.style.marginTop = '20px';
                vTitle.textContent = '차량별 평가 (Top ' + data.vehicle_top + ' / 전체 ' + data.vehicle_total_count + '대)';
                card.appendChild(vTitle);

                const table = document.createElement('table');
                table.className = 'vehicle-table';

                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                ['차량', '건수', '호평률', '불만률', '호평', '불만'].forEach(text => {
                    const th = document.createElement('th');
                    th.textContent = text;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                data.vehicle_analysis.forEach(v => {
                    const tr = document.createElement('tr');

                    const tdModel = document.createElement('td');
                    tdModel.style.fontWeight = '500';
                    tdModel.textContent = v.model;
                    tr.appendChild(tdModel);

                    const tdCount = document.createElement('td');
                    tdCount.textContent = v.count + '건';
                    tr.appendChild(tdCount);

                    const tdLike = document.createElement('td');
                    const likeBar = document.createElement('span');
                    likeBar.className = 'ratio-bar positive';
                    likeBar.style.width = Math.max(4, v.like_ratio * 0.6) + 'px';
                    tdLike.appendChild(likeBar);
                    tdLike.appendChild(document.createTextNode(v.like_ratio + '%'));
                    tr.appendChild(tdLike);

                    const tdDislike = document.createElement('td');
                    const dislikeBar = document.createElement('span');
                    dislikeBar.className = 'ratio-bar negative';
                    dislikeBar.style.width = Math.max(4, v.dislike_ratio * 0.6) + 'px';
                    tdDislike.appendChild(dislikeBar);
                    tdDislike.appendChild(document.createTextNode(v.dislike_ratio + '%'));
                    tr.appendChild(tdDislike);

                    const tdPraise = document.createElement('td');
                    tdPraise.textContent = v.top_praise || '-';
                    tr.appendChild(tdPraise);

                    const tdIssue = document.createElement('td');
                    tdIssue.textContent = v.top_issue || '-';
                    tr.appendChild(tdIssue);

                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                card.appendChild(table);
            }

            container.replaceChildren(card);
        }

        /* ========== Common ========== */

        async function handleError(resultCard, response) {
            let detail = '';
            try {
                const errData = await response.json();
                if (errData.detail) detail = errData.detail;
            } catch (_) { /* ignore */ }

            if (response.status === 401) {
                renderError(resultCard, '401 Unauthorized', detail || 'API 키가 유효하지 않습니다.');
            } else if (response.status === 404) {
                renderError(resultCard, '404 Not Found', detail || '해당 Branch ID의 데이터를 찾을 수 없습니다.');
            } else {
                renderError(resultCard, 'Error ' + response.status, detail || response.statusText);
            }
        }

        function renderError(container, title, message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';

            const titleEl = document.createElement('strong');
            titleEl.textContent = title;

            const br = document.createElement('br');

            const msgEl = document.createTextNode(message);

            errorDiv.appendChild(titleEl);
            errorDiv.appendChild(br);
            errorDiv.appendChild(msgEl);

            container.replaceChildren(errorDiv);
        }
    </script>
</body>

</html>
