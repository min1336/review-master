[project]
name = "review-summary-ai"
version = "1.0.0"
description = "Carmore 렌트카 리뷰 AI 요약 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    # Pydantic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "supabase>=2.3.0",
    "httpx>=0.26.0",
    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    # NLP
    "fastembed>=0.4.0",
    # LLM
    "openai>=1.10.0",
    # Utils
    "python-dotenv>=1.0.0",
    "kiwipiepy>=0.22.2",
    # AWS
    "boto3>=1.34.0",
    # Scheduler
    "apscheduler>=3.10.0",
    "croniter>=1.3.0",
    # PDF Generation
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.13",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.26.0"
]
[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv"
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "FA",
]

ignore = [
    "B008",  # FastAPI Depends 패턴 허용
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]  # sys.path 설정 후 import 필요
"app/infrastructure/llm/prompts.py" = ["E501"]  # 한국어 예시 텍스트
[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]
