[project]
name = "review-summary-ai"
version = "1.0.0"
description = "Carmore 렌트카 리뷰 AI 요약 시스템"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",

    # Pydantic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "supabase>=2.3.0",
    "httpx>=0.26.0",

    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",

    # NLP
    "mecab-python3>=1.0.0",
    "sentence-transformers>=2.2.0",

    # LLM
    "openai>=1.10.0",

    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
