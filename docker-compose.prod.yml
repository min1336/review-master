services:
  api-server:
    image: ${API_IMAGE:-ghcr.io/teamo2dev/review-api:latest}
    container_name: review-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY
      - LLM_PROVIDER
      - DATABASE_USER
      - DATABASE_PASSWORD
      - DATABASE_HOST
      - DATABASE_PORT
      - DATABASE_NAME
      - API_PREFIX
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - ATHENA_DATABASE
      - ATHENA_OUTPUT_BUCKET
      - PUBLIC_API_KEY
      - INTERNAL_API_KEY
      - N8N_API_KEY
      - N8N_TEST_MODE
      - CARMORE_ADMIN_URL
      - LIGHTWEIGHT_MODE=true
    cpus: "1.0"
    mem_limit: "1024m"
    networks:
      - n8n_network

networks:
  n8n_network:
    external: true
    name: n8n-cloud-tm2-network
