services:
  api-server:
    image: ${API_IMAGE:-ghcr.io/teamo2dev/review-api:latest}
    container_name: review-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY
      - LLM_PROVIDER
      - DATABASE_URL
      - API_PREFIX
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - ATHENA_DATABASE
      - ATHENA_OUTPUT_BUCKET
      - PUBLIC_API_KEY
      - N8N_API_KEY
      - N8N_TEST_MODE=false
    cpus: "0.5"
    mem_limit: "512m"
